<script>
/* Progress sync, same design as Viraj's Math Quest: each played level is saved as one small JSON
   file in a public GitHub repo, under a player code (never a name).
   - Saving needs a fine-grained token (Contents: read and write on the data repo only), entered once
     in Parent > Settings on Vihaan's device and kept in that device's storage, never in the site code.
   - Reading needs no token, so the parent report works on any device.
   - Files are only created, never edited. Anything not sent yet waits in a queue and retries later. */
window.VHSync = (function () {
  const DEFAULT_REPO = 'ankityagi/mathquest-progress', DEFAULT_BRANCH = 'main';
  const K_CFG = 'vh.sync', K_QUEUE = 'vh.queue', K_CACHE = 'vh.cache', K_LOG = 'vh.synclog';
  const API = 'https://api.github.com';
  const read = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  function config() { const c = read(K_CFG, {}); return { repo: c.repo || DEFAULT_REPO, branch: c.branch || DEFAULT_BRANCH, token: c.token || '' }; }
  function setConfig(c) { write(K_CFG, { repo: c.repo, branch: c.branch, token: c.token }); }
  const queue = () => read(K_QUEUE, []);
  const logResult = (ok, msg) => write(K_LOG, { at: new Date().toISOString(), ok, msg });
  async function why(r) { try { const j = await r.json(); return j.message ? ` (${j.message})` : ''; } catch (e) { return ''; } }
  function b64(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin); }
  const headers = token => Object.assign({ Accept: 'application/vnd.github+json' }, token ? { Authorization: 'Bearer ' + token } : {});
  function put(c, path, text, message) {
    return fetch(`${API}/repos/${c.repo}/contents/${path}`, { method: 'PUT', headers: Object.assign(headers(c.token), { 'Content-Type': 'application/json' }), body: JSON.stringify({ message, content: b64(text), branch: c.branch }) });
  }
  async function test(c) {
    if (!c.repo || !/^[\w.-]+\/[\w.-]+$/.test(c.repo)) return { ok: false, message: 'Repo should look like owner/name.' };
    if (!c.token) return { ok: false, message: 'Paste the access token first.' };
    try {
      const r = await fetch(`${API}/repos/${c.repo}`, { headers: headers(c.token) });
      if (r.status === 401) return { ok: false, message: 'GitHub did not accept that token. Check it was copied in full and has not expired.' };
      if (r.status === 404) return { ok: false, message: `GitHub can't find ${c.repo}, or the token isn't allowed to see it.` };
      if (!r.ok) return { ok: false, message: `GitHub answered ${r.status}. Try again in a minute.` };
      const j = await r.json();
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      const w = await put(c, `checks/${stamp}-p2.json`, JSON.stringify({ check: 'connection test', at: stamp }), 'Connection test');
      if (w.status === 403 || w.status === 404) { const m = 'The token can see the repo but not save to it. Edit the token: Repository access must include this repo, and Permissions → Contents must be "Read and write".' + (await why(w)); logResult(false, m); return { ok: false, message: m }; }
      if (w.status === 409 || w.status === 422) { const m = `GitHub refused the test file${await why(w)}. Check the branch name (usually main).`; logResult(false, m); return { ok: false, message: m }; }
      if (!w.ok) { const m = `Saving failed: GitHub answered ${w.status}${await why(w)}.`; logResult(false, m); return { ok: false, message: m }; }
      logResult(true, 'Connection test file saved.');
      return { ok: true, message: `Connected to ${j.full_name} and saved a test file.` };
    } catch (e) { return { ok: false, message: "Can't reach GitHub from here. (The claude.ai preview blocks it; use vihaan.ankityagi.online.)" }; }
  }
  function enqueue(path, obj) { const q = queue(); q.push({ path, content: JSON.stringify(obj, null, 1) }); write(K_QUEUE, q.slice(-500)); return flush(); }
  let flushing = null;
  function flush() {
    if (flushing) return flushing;
    flushing = (async () => {
      const c = config(); let q = queue(), sent = 0, error = '';
      if (!c.token) return { sent, pending: q.length, error: 'not set up' };
      while (q.length) {
        const item = q[0];
        try {
          const r = await put(c, item.path, item.content, `Add ${item.path.split('/').pop()}`);
          if (!r.ok && r.status !== 422) { error = `GitHub answered ${r.status}${await why(r)}`; break; } // 422: already there
        } catch (e) { error = 'offline or blocked'; break; }
        q = q.slice(1); write(K_QUEUE, q); sent++;
      }
      if (sent || error) logResult(!error, error ? `Upload failed: ${error}. ${q.length} waiting.` : `Uploaded ${sent} level(s).`);
      return { sent, pending: q.length, error };
    })().finally(() => { flushing = null; });
    return flushing;
  }
  // the repo's file list, reused for a minute so several readers share one request
  let treeAt = 0, treeP = null;
  function tree() {
    if (treeP && Date.now() - treeAt < 60000) return treeP;
    const c = config(); treeAt = Date.now();
    treeP = (async () => {
      const tr = await fetch(`${API}/repos/${c.repo}/git/trees/${c.branch}?recursive=1`, { headers: headers(c.token) });
      if (tr.status === 404 || tr.status === 409) return [];
      if (!tr.ok) throw new Error(`GitHub answered ${tr.status}`);
      return (await tr.json()).tree.map(n => n.path);
    })();
    treeP.catch(() => { treeP = null; });
    return treeP;
  }
  const sessions = player => files(`players/${player}/sessions/`);
  // every JSON file under a folder of the log (files are never edited, so they're cached)
  async function files(prefix) {
    const c = config();
    const paths = (await tree()).filter(p => p.startsWith(prefix) && p.endsWith('.json'));
    const cache = read(K_CACHE, {}), missing = paths.filter(p => !cache[p]);
    for (let i = 0; i < missing.length; i += 6) {
      await Promise.all(missing.slice(i, i + 6).map(async p => {
        const r = await fetch(`https://raw.githubusercontent.com/${c.repo}/${c.branch}/${p}`);
        if (r.ok) { try { cache[p] = await r.json(); } catch (e) { /* skip a bad file */ } }
      }));
    }
    write(K_CACHE, cache);
    return paths.map(p => cache[p]).filter(Boolean);
  }
  return { config, setConfig, test, enqueue, flush, sessions, files, pending: () => queue().length, lastLog: () => read(K_LOG, null), DEFAULT_REPO };
})();

/* Parent report, built from session records (one per level played), same as Viraj's. */
window.VHReport = (function () {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const median = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const secs = s => (s >= 90 ? `${Math.round(s / 6) / 10} min` : s < 10 ? `${Math.round(s * 10) / 10} s` : `${Math.round(s)} s`);
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
  function compute(sessions, topics, areas) {
    const tById = Object.fromEntries(topics.map(t => [t.id, t])), qs = [];
    sessions.forEach(s => (s.questions || []).forEach(q => qs.push(Object.assign({ topic: s.topic, level: s.level }, q))));
    const typical = median(qs.map(q => q.seconds).filter(Boolean)) || 20;
    const types = {};
    qs.forEach(q => { const k = `${q.topic}|${q.level}|${q.type}`; const g = (types[k] = types[k] || { topic: q.topic, level: q.level, type: q.type, n: 0, right: 0, times: [], hints: 0 }); g.n++; if (q.correct) g.right++; if (q.hint) g.hints++; if (q.seconds) g.times.push(q.seconds); });
    const typeRows = Object.values(types).map(g => Object.assign(g, { acc: pct(g.right, g.n), med: median(g.times) }));
    const workOn = typeRows.filter(g => g.n >= 3 && (g.acc < 75 || g.med > typical * 1.6)).sort((a, b) => a.acc - b.acc || b.med - a.med).slice(0, 8);
    const strong = typeRows.filter(g => g.n >= 3 && g.acc >= 90 && g.med <= typical).sort((a, b) => a.med - b.med).slice(0, 6);
    const lv = {};
    sessions.forEach(s => { const k = `${s.topic}|${s.level}`; const g = (lv[k] = lv[k] || { topic: s.topic, level: s.level, title: s.levelTitle, tries: 0, finished: 0, best: 0, last: null, passed: false, times: [] }); g.tries++; if (s.completed) { g.finished++; g.best = Math.max(g.best, s.correct); g.last = s.correct; if (s.stars > 0) g.passed = true; } (s.questions || []).forEach(q => q.seconds && g.times.push(q.seconds)); });
    const levelRows = Object.values(lv).map(g => Object.assign(g, { med: median(g.times) })).sort((a, b) => (a.topic === b.topic ? a.level - b.level : topics.findIndex(t => t.id === a.topic) - topics.findIndex(t => t.id === b.topic)));
    const stuck = levelRows.filter(g => !g.passed && g.tries >= 2);
    const areaRows = areas.map(a => { const aq = qs.filter(q => (tById[q.topic] || {}).area === a.id); return { name: a.name, n: aq.length, acc: pct(aq.filter(q => q.correct).length, aq.length), med: median(aq.map(q => q.seconds).filter(Boolean)) }; }).filter(a => a.n);
    const recent = sessions.slice().sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1)).slice(0, 12);
    return { tById, typical, workOn, strong, levelRows, stuck, areaRows, recent, total: { sessions: sessions.length, questions: qs.length, acc: pct(qs.filter(q => q.correct).length, qs.length), hints: qs.filter(q => q.hint).length, last: recent[0] && recent[0].startedAt } };
  }
  function render(el, sessions, topics, areas, name, top, note) {
    if (!sessions.length) { el.innerHTML = `${top || ''}<div class="empty"><h2 class="rep-h">No levels played yet</h2><p class="muted">Each level ${esc(name)} finishes (or stops after answering) shows up here: his score, how many tries each level took, and how long each question took.</p>${note || ''}</div>`; return; }
    const r = compute(sessions, topics, areas);
    const tName = id => (r.tById[id] || {}).name || id;
    const speed = s => (s > r.typical * 1.6 ? '<span class="chip slow">slow</span>' : s < r.typical * 0.7 ? '<span class="chip fast">fast</span>' : '');
    const typeRow = g => `<tr><td><b>${esc(tName(g.topic))} · L${g.level}</b><br><span class="muted">${esc(g.type)}</span></td><td class="num">${g.acc}%<br><span class="muted">${g.right}/${g.n}</span></td><td class="num">${secs(g.med)} ${speed(g.med)}</td></tr>`;
    el.innerHTML = `
      <div class="kpis"><div><b>${r.total.sessions}</b><span>levels played</span></div><div><b>${r.total.questions}</b><span>questions</span></div><div><b>${r.total.acc}%</b><span>correct</span></div><div><b>${secs(r.typical)}</b><span>typical time per question</span></div></div>
      <p class="muted small">Last played ${esc(when(r.total.last))}. Hints used on ${r.total.hints} questions. "Slow" means more than 1.6× his typical time; "fast" means under 0.7×.</p>
      ${top || ''}
      <h2 class="rep-h">Work on next</h2>
      ${r.workOn.length || r.stuck.length ? `${r.stuck.length ? `<p class="callout">Stuck: ${r.stuck.map(g => `<b>${esc(tName(g.topic))} level ${g.level}</b> (${g.tries} tries, best ${g.best}/10)`).join(', ')}.</p>` : ''}
        ${r.workOn.length ? `<div class="tablewrap"><table class="rep"><tr><th>Question type</th><th>Correct</th><th>Time</th></tr>${r.workOn.map(typeRow).join('')}</table></div>` : ''}`
        : '<p class="muted">Nothing stands out yet. A question type shows up here once he has answered it 3 times and is below 75% correct or slow.</p>'}
      ${r.strong.length ? `<h2 class="rep-h">Strong and quick</h2><div class="tablewrap"><table class="rep"><tr><th>Question type</th><th>Correct</th><th>Time</th></tr>${r.strong.map(typeRow).join('')}</table></div>` : ''}
      ${r.areaRows.length ? `<h2 class="rep-h">By area</h2><div class="tablewrap"><table class="rep"><tr><th>Area</th><th>Correct</th><th>Typical time</th></tr>${r.areaRows.map(a => `<tr><td>${esc(a.name)}<br><span class="muted">${a.n} questions</span></td><td class="num">${a.acc}%</td><td class="num">${secs(a.med)} ${speed(a.med)}</td></tr>`).join('')}</table></div>` : ''}
      <h2 class="rep-h">Levels and tries</h2>
      <div class="tablewrap"><table class="rep"><tr><th>Level</th><th>Tries</th><th>Best</th><th>Last</th><th>Time</th></tr>
        ${r.levelRows.map(g => `<tr><td><b>${esc(tName(g.topic))} · L${g.level}</b><br><span class="muted">${esc(g.title || '')}</span></td><td class="num">${g.tries}${g.tries > g.finished ? `<br><span class="muted">${g.tries - g.finished} quit</span>` : ''}</td><td class="num">${g.finished ? g.best + '/10' : '–'} ${g.passed ? '<span class="chip ok">passed</span>' : ''}</td><td class="num">${g.last == null ? '–' : g.last + '/10'}</td><td class="num">${secs(g.med)}</td></tr>`).join('')}
      </table></div>
      <h2 class="rep-h">Recent sessions</h2>
      <div class="tablewrap"><table class="rep"><tr><th>When</th><th>Level</th><th>Score</th><th>Time</th></tr>
        ${r.recent.map(s => `<tr><td>${esc(when(s.startedAt))}</td><td>${esc(tName(s.topic))} · L${s.level}</td><td class="num">${s.correct}/${s.completed ? s.total : (s.questions || []).length}${s.completed ? '' : ' <span class="chip">quit</span>'}${s.stars ? ' ' + '★'.repeat(s.stars) : ''}</td><td class="num">${secs(s.seconds || 0)}</td></tr>`).join('')}
      </table></div>
      ${note || ''}`;
  }
  return { compute, render };
})();
</script>

<script src="playcode.js"></script>
<script>
/* ======================= App ======================= */
(function () {
  const { TOPICS, AREAS, KID } = window.VQ;
  const QUESTIONS = 10, PASS = 8, SILVER = 9;
  const PLAYER = { id: 'p1', name: KID }, CODE = 'p2'; // CODE: anonymous id in the progress repo (Viraj is p1)
  const K_STATE = 'vh.state', K_SESS = 'vh.sessions', K_PINS = 'vh.pins', K_CUR = 'vh.current', K_VOICE = 'vh.voice';
  const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage off: keep going */ } };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let state = lsGet(K_STATE, null); if (!state || !state.topics) state = { xp: 0, topics: {} };
  const save = () => lsSet(K_STATE, state);
  const prog = id => (state.topics[id] = state.topics[id] || { stars: {} });
  const starsFor = (t, i) => prog(t.id).stars[i] || 0;
  let parentMode = false, loggedIn = false;
  const unlocked = (t, i) => parentMode || i === 0 || starsFor(t, i - 1) > 0;
  const cleared = t => t.levels.filter((_, i) => starsFor(t, i) > 0).length;
  const totalStars = t => t.levels.reduce((s, _, i) => s + starsFor(t, i), 0);

  /* ---------- read aloud ---------- */
  let voiceOn = lsGet(K_VOICE, true);
  const voiceBtn = document.getElementById('voice');
  function paintVoice() { voiceBtn.textContent = voiceOn ? '🔊 On' : '🔇 Off'; voiceBtn.setAttribute('aria-pressed', String(voiceOn)); voiceBtn.setAttribute('aria-label', voiceOn ? 'Reading out loud is on' : 'Reading out loud is off'); }
  voiceBtn.addEventListener('click', () => { voiceOn = !voiceOn; lsSet(K_VOICE, voiceOn); paintVoice(); if (!voiceOn) hush(); });
  paintVoice();
  // voice: the parent can pick one in Settings (kept on this device); otherwise the most natural English voice the device has
  const K_VNAME = 'vh.voiceName', K_VSPEED = 'vh.voiceSpeed';
  const SPEEDS = { slow: { rate: 0.82, pitch: 1.1, label: 'Slower' }, normal: { rate: 0.95, pitch: 1.15, label: 'Normal' }, quick: { rate: 1.06, pitch: 1.18, label: 'Quicker' } };
  let voice = null;
  const enVoices = () => { try { return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (e) { return []; } };
  function voiceRank(v) { // higher is more natural-sounding
    let r = 0;
    if (/natural|neural|premium|enhanced|siri/i.test(v.name)) r += 50;
    if (/Ava|Jenny|Aria|Emma|Ana|Michelle|Zoe|Allison|Samantha|Google US English/i.test(v.name)) r += 20;
    if (/en-US/i.test(v.lang)) r += 10; else if (/en-(GB|AU|CA|IE|NZ)/i.test(v.lang)) r += 4;
    if (/compact|eSpeak|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Zarvox|Wobble|Superstar|Junior|Ralph|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy/i.test(v.name)) r -= 40;
    return r;
  }
  const rankedVoices = () => enVoices().sort((a, b) => voiceRank(b) - voiceRank(a) || a.name.localeCompare(b.name));
  function chooseVoice() { const want = lsGet(K_VNAME, ''), vs = rankedVoices(); voice = (want && vs.find(v => v.name === want)) || vs[0] || null; }
  try { chooseVoice(); speechSynthesis.addEventListener('voiceschanged', chooseVoice); } catch (e) { /* no speech */ }
  function hush() { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  function speak(text, force) {
    if ((!voiceOn && !force) || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/−/g, ' minus ').replace(/_/g, ' blank '));
      if (voice) u.voice = voice;
      const sp = SPEEDS[lsGet(K_VSPEED, 'normal')] || SPEEDS.normal; u.rate = sp.rate; u.pitch = sp.pitch; speechSynthesis.speak(u);
    } catch (e) { /* speech not available */ }
  }

  /* ---------- PIN and picture code ---------- */
  function hash(s) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57; s = 'vh:' + s;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  const pins = () => lsGet(K_PINS, {});
  const setPin = (k, v) => { const p = pins(); if (v == null) delete p[k]; else p[k] = v; lsSet(K_PINS, p); };
  function modal(html) {
    const wrap = document.createElement('div'); wrap.className = 'modal';
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
    return wrap;
  }
  // Parent PIN: digits. Kid-proof, not real security: only a hash is kept on this device.
  function pinDialog(mode, onOk) {
    const setting = mode === 'set';
    const w = modal(`<h2>${setting ? 'Set a parent PIN' : 'Parent PIN'}</h2>
      <p class="lede">${setting ? 'Choose 4 to 8 digits. You need it for Parent mode and the report on this device.' : 'Enter the parent PIN.'}</p>
      <label class="sr" for="pin1">PIN</label><input id="pin1" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">
      ${setting ? '<label class="sr" for="pin2">Type it again</label><input id="pin2" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Again">' : ''}
      <p class="err" id="pin-err" hidden></p>
      <div class="actions"><button class="btn" type="button" id="pin-cancel">Cancel</button><button class="btn primary" type="button" id="pin-ok">${setting ? 'Save PIN' : 'Unlock'}</button></div>`);
    const $ = s => w.querySelector(s), err = $('#pin-err');
    const fail = m => { err.textContent = m; err.hidden = false; $('#pin1').value = ''; if ($('#pin2')) $('#pin2').value = ''; $('#pin1').focus(); };
    const ok = () => {
      const a = $('#pin1').value.trim();
      if (setting) { if (!/^\d{4,8}$/.test(a)) return fail('Use 4 to 8 digits.'); if (a !== $('#pin2').value.trim()) return fail('The two PINs do not match.'); setPin('parent', hash(a)); }
      else if (hash(a) !== pins().parent) return fail('That PIN is not right.');
      w.remove(); onOk();
    };
    $('#pin-ok').addEventListener('click', ok); $('#pin-cancel').addEventListener('click', () => w.remove());
    w.querySelectorAll('.pin').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } }));
    $('#pin1').focus();
  }
  function parentGate(onOk) { pinDialog(pins().parent ? 'enter' : 'set', onOk); }

  // Picture code for the kid: tap 3 pictures in order. Easier than digits for a six-year-old.
  const PICS = ['🐶', '🐱', '🦁', '🐸', '🚀', '⚽', '🍕', '🌈', '🦖'];
  function pictureCode(mode, onOk) {
    const setting = mode === 'set'; let seq = [], first = null;
    const w = modal(`<h2>${setting ? `Hi ${KID}! Make your secret code` : `Hi ${KID}!`}</h2>
      <p class="lede" id="pc-msg">${setting ? 'Tap 3 pictures. Remember them!' : 'Tap your 3 secret pictures.'}</p>
      <div class="slots" aria-live="polite"><i></i><i></i><i></i></div>
      <div class="picks">${PICS.map(p => `<button type="button" data-p="${p}" aria-label="${p}">${p}</button>`).join('')}</div>
      <div class="actions"><button class="link" type="button" id="pc-forgot"${setting ? ' hidden' : ''}>Forgot? Ask a grown-up</button><button class="btn" type="button" id="pc-clear">Start over</button></div>`);
    const msg = w.querySelector('#pc-msg'), slots = [...w.querySelectorAll('.slots i')];
    const paint = () => slots.forEach((s, i) => { s.textContent = seq[i] || ''; s.classList.toggle('full', !!seq[i]); });
    speak(setting ? `Hi ${KID}! Tap 3 pictures to make your secret code.` : `Hi ${KID}! Tap your 3 secret pictures.`);
    w.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
      if (seq.length >= 3) return;
      seq.push(b.dataset.p); paint();
      if (seq.length < 3) return;
      setTimeout(() => {
        const code = seq.join('');
        if (setting && !first) { first = code; seq = []; paint(); msg.textContent = 'Now tap the same 3 again.'; speak('Now tap the same 3 again.'); return; }
        if (setting) {
          if (code !== first) { first = null; seq = []; paint(); msg.textContent = 'Those did not match. Pick 3 new ones.'; speak('Those did not match. Pick 3 again.'); return; }
          setPin('kid', hash(code)); w.remove(); onOk(); return;
        }
        if (hash(code) === pins().kid) { w.remove(); onOk(); }
        else { seq = []; paint(); msg.textContent = 'Oops, not those. Try again!'; speak('Oops. Try again!'); }
      }, 250);
    }));
    w.querySelector('#pc-clear').addEventListener('click', () => { seq = []; paint(); });
    w.querySelector('#pc-forgot').addEventListener('click', () => { w.remove(); parentGate(() => { setPin('kid', null); pictureCode('set', onOk); }); });
  }

  /* ---------- screens ---------- */
  const app = document.getElementById('app'), xpEl = document.getElementById('xp');
  const starRow = (n, max = 3) => `<span class="stars" aria-label="${n} of ${max} stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(max - n)}</span></span>`;
  function showXP() {
    xpEl.textContent = `${state.xp} XP`; xpEl.hidden = !loggedIn;
    coinEl.hidden = !loggedIn;
    if (loggedIn) { const b = balance(); coinEl.innerHTML = `<span aria-hidden="true">🪙</span> ${b}`; coinEl.setAttribute('aria-label', `${b} coin${b === 1 ? '' : 's'}`); }
    const who = document.getElementById('who');
    who.innerHTML = loggedIn ? `<button class="link" id="logout">Log out</button>` : '';
    if (loggedIn) document.getElementById('logout').addEventListener('click', logout);
  }
  function go(html, focusSel) { hush(); app.innerHTML = html; window.scrollTo(0, 0); const f = focusSel && app.querySelector(focusSel); if (f) f.focus({ preventScroll: true }); }

  /* ---------- coins and play time ----------
     Same as Viraj's site. Stars earn coins: each level's best stars count once (replaying earns
     nothing new), at the rate a parent sets in Parent → Settings. Coins buy play time on BrainPlay
     (games.ankityagi.online) as a short code that works only today (see playcode.js).
     Each spend is saved on this device and as a file in the progress log under players/p2/spends/,
     so the balance follows him to other devices: earned (from stars) minus spent. */
  const coinEl = document.getElementById('coins');
  const DEFAULT_RATE = { starsPerCoin: 1, minutesPerCoin: 5 };
  const BRAINPLAY = 'https://games.ankityagi.online';
  const K_RATE = 'vh.coinrate', K_SPENDS = 'vh.spends';
  const rateOf = () => { const r = lsGet(K_RATE, null); return r && r.starsPerCoin > 0 && r.minutesPerCoin > 0 ? r : Object.assign({ at: '' }, DEFAULT_RATE); };
  const spends = () => lsGet(K_SPENDS, []);
  const allStars = () => Object.values(state.topics).reduce((s, p) => s + Object.values(p.stars || {}).reduce((a, b) => a + (+b || 0), 0), 0);
  const earned = () => Math.floor(allStars() / rateOf().starsPerCoin);
  const spentCoins = () => spends().reduce((s, x) => s + (+x.coins || 0), 0);
  const balance = () => Math.max(0, earned() - spentCoins());
  // play codes hold 5 to 80 minutes in steps of 5, so offer those amounts that a whole number of coins buys
  // (at 1 minute per coin: 5 min costs 5 coins, 10 min costs 10, and so on)
  const playOptions = () => { const m = rateOf().minutesPerCoin; return [5, 10, 15, 20, 30, 40, 60, 80].filter(min => min % m === 0).slice(0, 8).map(min => ({ coins: min / m, minutes: min })); };
  const stampId = now => now.toISOString().replace(/[:.]/g, '-') + '-' + Math.random().toString(36).slice(2, 6);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  function setRate(r) {
    const rec = { v: 1, player: CODE, starsPerCoin: r.starsPerCoin, minutesPerCoin: r.minutesPerCoin, at: new Date().toISOString() };
    lsSet(K_RATE, rec);
    return window.VHSync.enqueue(`players/${CODE}/settings/coins/${stampId(new Date())}.json`, rec);
  }
  function spendCoins(coins) {
    const minutes = coins * rateOf().minutesPerCoin;
    if (coins < 1 || coins > balance()) return null;
    const day = PlayCode.today(), mine = spends();
    const used = new Set(mine.filter(x => x.day === day).map(x => x.nonce));
    let nonce = Math.floor(Math.random() * 256);
    for (let k = 0; k < 256 && used.has(nonce); k++) nonce = (nonce + 1) % 256;
    const now = new Date(), id = stampId(now);
    const sp = { v: 1, id, player: CODE, coins, minutes, code: PlayCode.make(CODE, minutes, nonce, day), day, nonce, at: now.toISOString() };
    lsSet(K_SPENDS, mine.concat(sp));
    window.VHSync.enqueue(`players/${CODE}/spends/${id.slice(0, 4)}/${id.slice(5, 7)}/${id}.json`, sp);
    showXP();
    return sp;
  }
  // bring spends and the parent's rate over from the progress log (other devices)
  async function restoreCoins() {
    try {
      const [remote, rates] = await Promise.all([window.VHSync.files(`players/${CODE}/spends/`), window.VHSync.files(`players/${CODE}/settings/coins/`)]);
      const local = spends(), have = new Set(local.map(x => x.id));
      const add = remote.filter(x => x && x.id && x.player === CODE && !have.has(x.id));
      if (add.length) lsSet(K_SPENDS, local.concat(add));
      const newest = rates.filter(r => r && r.starsPerCoin > 0 && r.minutesPerCoin > 0).sort((a, b) => (a.at < b.at ? -1 : 1)).pop();
      if (newest && newest.at > (rateOf().at || '')) lsSet(K_RATE, newest);
      if (loggedIn) showXP();
    } catch (e) { /* offline: keep what this device has */ }
  }
  // read a code one character at a time, so he can type it in
  const sayCode = code => code.split('').map(ch => (/\d/.test(ch) ? ch : ch + '.')).join(' ');

  function coinsPage(fresh) {
    if (location.hash !== '#coins') history.replaceState(null, '', '#coins');
    const r = rateOf(), bal = balance(), day = PlayCode.today();
    const mine = spends().slice().sort((a, b) => (a.at < b.at ? 1 : -1));
    const todays = mine.filter(x => x.day === day), past = mine.filter(x => x.day !== day).slice(0, 8);
    const minutesBought = mine.reduce((s, x) => s + (+x.minutes || 0), 0);
    const per = r.starsPerCoin === 1 ? 'Every star is 1 coin' : `Every ${r.starsPerCoin} stars make 1 coin`;
    const open = cls => `<a class="btn ${cls}" href="${BRAINPLAY}" target="_blank" rel="noopener">Go to BrainPlay →</a>`;
    const when = x => new Date(x.at).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const opts = playOptions();
    go(`<nav><button class="link" id="back">← All quests</button></nav>
        ${fresh ? `<section class="panel codebox" aria-live="polite">
          <p class="eyebrow">Your play code</p>
          <p class="playcode">${PlayCode.pretty(fresh.code)}</p>
          <p class="lede">Type it into BrainPlay for <b>${fresh.minutes} minutes</b> of games. It works <b>today only</b>, one time.</p>
          <div class="actions"><button class="btn" type="button" id="saycode">🔊 Read my code</button>${open('primary')}</div>
        </section>` : ''}
        <section class="wallet">
          <div class="wallet-main">
            <p class="eyebrow">${KID}'s coins</p>
            <h1><span aria-hidden="true">🪙</span> ${plural(bal, 'coin')}</h1>
            <p class="lede">That's up to <b>${bal * r.minutesPerCoin} minutes</b> of games.</p>
          </div>
          ${open(fresh ? '' : 'primary')}
        </section>
        <dl class="coinstats">
          <div><dt>Stars</dt><dd>${allStars()}</dd></div>
          <div><dt>Coins earned</dt><dd>${earned()}</dd></div>
          <div><dt>Coins spent</dt><dd>${spentCoins()}</dd></div>
          <div><dt>Minutes bought</dt><dd>${minutesBought}</dd></div>
        </dl>
        <p class="lede">${per}, and 1 coin is ${plural(r.minutesPerCoin, 'minute')}. Win new levels or get more stars to earn more.</p>
        <h2 class="area-h">Get play time</h2>
        <div class="playopts">${opts.map(o => `<button class="btn${o.coins <= bal ? ' primary' : ''}" type="button" data-coins="${o.coins}" ${o.coins <= bal ? '' : 'disabled'}><b>${o.minutes} min</b><small>${plural(o.coins, 'coin')}</small></button>`).join('')}</div>
        ${!opts.length || bal < opts[0].coins ? '<p class="lede">Win a new level or get more stars to earn coins.</p>' : ''}
        ${todays.length ? `<h2 class="area-h">Today's codes</h2>
        <ul class="codelist">${todays.map(x => `<li><span class="playcode sm">${PlayCode.pretty(x.code)}</span> ${x.minutes} min · ${new Date(x.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</li>`).join('')}</ul>
        <p class="muted small">Each code works once on BrainPlay, until midnight.</p>` : ''}
        ${past.length ? `<h2 class="area-h">Earlier play time</h2>
        <ul class="codelist">${past.map(x => `<li>${x.minutes} min for ${plural(x.coins, 'coin')} · ${when(x)}</li>`).join('')}</ul>` : ''}`,
      fresh ? '#saycode' : '.wallet .btn');
    app.querySelector('#back').addEventListener('click', home);
    app.querySelectorAll('[data-coins]').forEach(b => b.addEventListener('click', () => confirmSpend(+b.dataset.coins)));
    const sc = app.querySelector('#saycode');
    if (sc) sc.addEventListener('click', () => speak(`Your code is ${sayCode(fresh.code)}`, true));
    if (fresh) speak(`Here is your code for ${fresh.minutes} minutes. ${sayCode(fresh.code)}`);
    else speak(`You have ${plural(bal, 'coin')}.`);
  }
  function confirmSpend(coins) {
    const minutes = coins * rateOf().minutesPerCoin;
    const w = modal(`<h2>Trade ${plural(coins, 'coin')} for ${minutes} minutes?</h2>
        <p class="lede">You'll get a code to type into BrainPlay. It only works today, so get it when you're ready to play.</p>
        <div class="actions"><button class="btn" type="button" id="sp-no">Not now</button><button class="btn primary" type="button" id="sp-yes">Get my code</button></div>`);
    w.querySelector('#sp-no').addEventListener('click', () => w.remove());
    w.addEventListener('keydown', e => { if (e.key === 'Escape') w.remove(); });
    w.querySelector('#sp-yes').addEventListener('click', () => { w.remove(); const sp = spendCoins(coins); if (sp) coinsPage(sp); else coinsPage(); });
    w.querySelector('#sp-yes').focus();
    speak(`Trade ${plural(coins, 'coin')} for ${minutes} minutes?`);
  }

  function login() {
    loggedIn = false; showXP();
    go(`<section><p class="eyebrow">Vihaan's Quest</p><h1>Who's playing?</h1><p class="lede">Tap your name and your secret pictures to start.</p></section>
      <div class="tiles players"><button class="tile" id="pl"><span class="avatar">V</span><h2>${KID}</h2><span class="tag">${pins().kid ? 'Play' : 'Start'}</span></button></div>`, '#pl');
    app.querySelector('#pl').addEventListener('click', () => pictureCode(pins().kid ? 'enter' : 'set', () => startAs()));
  }
  function startAs(topic) { loggedIn = true; lsSet(K_CUR, PLAYER.id); parentMode = false; showXP(); topic === 'coins' ? coinsPage() : topic ? map(topic) : home(); window.VHSync.flush(); restore(); restoreCoins(); }
  function logout() { lsSet(K_CUR, null); parentMode = false; login(); }

  function home() {
    if (!loggedIn) return login();
    const tile = t => {
      const c = cleared(t), n = t.levels.length;
      return `<button class="tile" data-topic="${t.id}">
        <span class="badge ${t.color}" aria-hidden="true">${t.mark}</span>
        <h2>${t.name}</h2><p>${t.blurb}</p>
        <div class="foot"><div class="meter" aria-hidden="true"><i style="width:${(c / n) * 100}%"></i></div><span>${c}/${n} levels · ${starRow(Math.min(3, Math.round(totalStars(t) / n)))}</span></div>
        <span class="tag">${c === 0 ? 'Start' : c === n ? 'Replay' : 'Go on'}</span></button>`;
    };
    const sections = AREAS.map(a => `<section class="area"><h2 class="area-h">${a.name}${a.focus ? ' <span class="pill">Practice most</span>' : ''}</h2><div class="tiles">${TOPICS.filter(t => t.area === a.id).map(tile).join('')}</div></section>`).join('');
    go(`<section><p class="eyebrow">Pick a quest</p><h1>Hi ${KID}! What shall we do?</h1>
        <p class="lede">Every quest has 10 levels. Get ${PASS} out of ${QUESTIONS} right to open the next level. Tap 🔊 to hear any question.</p></section>
        <button class="coinbar" id="coinbar" type="button"><span class="coinbig" aria-hidden="true">🪙</span><span><b>${plural(balance(), 'coin')}</b><small>Stars earn coins. Trade them for game time.</small></span><span class="go">Get play time</span></button>${sections}`);
    app.querySelector('#coinbar').addEventListener('click', () => coinsPage());
    app.querySelectorAll('[data-topic]').forEach(b => b.addEventListener('click', () => map(TOPICS.find(t => t.id === b.dataset.topic))));
    speak(`Hi ${KID}! Pick a quest.`);
  }

  function map(t) {
    const c = cleared(t);
    const nextIdx = t.levels.findIndex((_, i) => unlocked(t, i) && starsFor(t, i) === 0);
    const cards = t.levels.map((L, i) => {
      const open = unlocked(t, i), s = starsFor(t, i);
      return `<button class="lvl${open ? '' : ' locked'}${i === nextIdx ? ' next' : ''}${s ? ' done' : ''}" data-i="${i}" ${open ? '' : 'disabled'}>
        <span class="lvl-n">${i + 1}</span>
        <span class="lvl-b"><b>${L.title}</b><small>${open ? L.skill : 'Finish level ' + i + ' to open'}</small></span>
        <span>${open ? starRow(s) : '🔒'}</span></button>`;
    }).join('');
    go(`<nav><button class="link" id="back">← All quests</button></nav>
      <section><p class="eyebrow">${t.grade}</p><h1>${t.name}</h1><p class="lede">${c} of ${t.levels.length} levels done · ${totalStars(t)} of ${t.levels.length * 3} stars</p>
      <div class="path" aria-hidden="true">${t.levels.map((_, i) => `<span class="${starsFor(t, i) ? 'on' : ''}"></span>`).join('')}</div></section>
      <div class="levels">${cards}</div>
      <p class="parent-note">${parentMode ? `<b>Parent mode is on.</b> Every level is open until you turn it off or reload. <button class="link" id="pm-off">Turn off</button>` : `<button class="link" id="pm-on">🔒 Parent mode</button> opens every level (needs the parent PIN).`}</p>`, '.lvl.next');
    app.querySelector('#back').addEventListener('click', home);
    const on = app.querySelector('#pm-on'), off = app.querySelector('#pm-off');
    if (on) on.addEventListener('click', () => parentGate(() => { parentMode = true; map(t); }));
    if (off) off.addEventListener('click', () => { parentMode = false; map(t); });
    app.querySelectorAll('.lvl:not(.locked)').forEach(b => b.addEventListener('click', () => play(t, +b.dataset.i)));
  }

  /* ---------- playing ---------- */
  function makeQuestions(L) {
    const key = q => (q.prompt || '') + (q.fig || '') + (q.choices ? q.choices.slice().sort().join('|') : '') + (q.kind === 'trace' ? q.letter + Math.random() : '');
    const out = [], seen = new Set(); let pool = [];
    while (out.length < QUESTIONS) {
      if (!pool.length) pool = window.VQ.util.shuffle(L.variants);
      const v = pool.pop(); let q, tries = 0;
      do { q = v(); tries++; } while (seen.has(key(q)) && tries < 25);
      seen.add(key(q)); out.push(q);
    }
    return out;
  }

  function play(t, li) {
    const L = t.levels[li];
    const run = { qs: makeQuestions(L), i: 0, right: 0, hints: 0, log: [], qlog: [], started: new Date().toISOString() };
    question();
    function dots() { return run.qs.map((_, k) => { const r = run.log[k]; return `<i class="${r === true ? 'ok' : r === false ? 'no' : k === run.i ? 'cur' : ''}"></i>`; }).join(''); }

    function question() {
      const q = run.qs[run.i];
      let ui = '';
      if (q.kind === 'choice') ui = `<div class="choices">${q.choices.map((c, k) => `<button class="choice ${q.cls || ''}" data-k="${k}">${c}</button>`).join('')}</div>`;
      else if (q.kind === 'num') ui = `<div class="entry"><div class="screen empty" id="screen" aria-live="polite">?</div>
          <div class="pad" id="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `<button type="button" data-n="${n}">${n}</button>`).join('')}<button type="button" class="wide" data-n="del" aria-label="Delete">⌫</button><button type="button" class="go" id="check">Check ✓</button></div></div>`;
      else ui = `<div class="tracebox"><canvas id="cv" width="300" height="300" aria-label="Tracing box for the letter ${q.letter}"></canvas><p class="tracemsg" id="tmsg"></p>
          <div class="tracebtns"><button class="btn" type="button" id="tclear">Clear</button><button class="btn primary" type="button" id="check">Check ✓</button></div></div>`;
      go(`<div class="playtop"><button class="link" id="quit">✕ Stop</button><span class="where">Level ${li + 1} · ${L.title}</span><span class="dots" aria-label="Question ${run.i + 1} of ${QUESTIONS}">${dots()}</span></div>
        <article class="qcard">
          <div class="qhead"><p class="qnum">Question ${run.i + 1} of ${QUESTIONS}</p><button class="say" id="say" type="button">🔊 Read to me</button></div>
          <div class="prompt">${q.prompt}</div>
          ${q.fig ? `<figure class="fig">${q.fig}</figure>` : ''}
          ${ui}
          <div class="hintrow"><button class="link" id="hint">💡 Need a hint?</button><p class="hinttext" id="hinttext" hidden>${q.hint}</p></div>
          <div class="feedback" id="fb" hidden></div>
        </article>`);
      q.t0 = performance.now();
      speak(q.say);
      app.querySelector('#say').addEventListener('click', () => speak(q.say, true));
      app.querySelector('#quit').addEventListener('click', () => { if (run.qlog.length) record(t, li, run, false, 0); map(t); });
      app.querySelector('#hint').addEventListener('click', e => { const ht = app.querySelector('#hinttext'); ht.hidden = false; q.usedHint = true; e.target.hidden = true; speak(q.hint, true); });
      if (q.kind === 'choice') app.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => check(+b.dataset.k, b)));
      else if (q.kind === 'num') numPad(q);
      else tracer(q);
    }

    function numPad(q) {
      let val = '';
      const scr = app.querySelector('#screen');
      const paint = () => { scr.textContent = val || '?'; scr.classList.toggle('empty', !val); };
      const press = n => { if (scr.classList.contains('right') || scr.classList.contains('wrong')) return; if (n === 'del') val = val.slice(0, -1); else if (val.length < 3) val = (val === '0' ? '' : val) + n; paint(); };
      app.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => press(b.dataset.n)));
      const submit = () => { if (!val) { speak('Tap the numbers to type your answer.', true); return; } check(+val, null, val); };
      app.querySelector('#check').addEventListener('click', submit);
      const onKey = e => {
        if (!document.body.contains(scr)) { document.removeEventListener('keydown', onKey); return; }
        if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') { e.preventDefault(); if (!scr.classList.contains('right') && !scr.classList.contains('wrong')) submit(); }
      };
      document.addEventListener('keydown', onKey);
    }

    function tracer(q) {
      const cv = app.querySelector('#cv'), ctx = cv.getContext('2d'), dpr = Math.max(1, window.devicePixelRatio || 1);
      cv.width = 300 * dpr; cv.height = 300 * dpr; ctx.scale(dpr, dpr);
      const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
      const guide = window.VQ.strokes(q.letter); let ink = [], cur = null, tries = 0;
      function draw() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = col('--ink'); ctx.lineWidth = 3; ctx.setLineDash([]);
        [40, 240].forEach(y => { ctx.beginPath(); ctx.moveTo(10, y); ctx.lineTo(290, y); ctx.stroke(); });
        ctx.strokeStyle = col('--muted'); ctx.setLineDash([12, 10]); ctx.beginPath(); ctx.moveTo(10, 140); ctx.lineTo(290, 140); ctx.stroke();
        const alpha = q.guide === 1 ? 0.9 : q.guide === 2 ? 0.4 : 0;
        if (alpha) {
          ctx.globalAlpha = alpha; ctx.strokeStyle = col('--grape'); ctx.lineWidth = 9; ctx.setLineDash([1, 13]);
          guide.forEach(s => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); });
          ctx.globalAlpha = 1;
        }
        ctx.setLineDash([]);
        guide.forEach((s, i) => {
          const [x, y] = s[0];
          ctx.fillStyle = col('--grass'); ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '600 15px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x, y + 1);
        });
        ctx.strokeStyle = col('--sky'); ctx.lineWidth = 12;
        strokesDrawn.forEach(s => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); if (s.length === 1) ctx.lineTo(s[0][0] + .1, s[0][1]); ctx.stroke(); });
      }
      let strokesDrawn = [];
      const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 300 / r.height]; };
      const add = p => { const last = cur[cur.length - 1]; if (last) { const d = Math.hypot(p[0] - last[0], p[1] - last[1]), n = Math.floor(d / 3); for (let k = 1; k <= n; k++) ink.push([last[0] + (p[0] - last[0]) * k / (n + 1), last[1] + (p[1] - last[1]) * k / (n + 1)]); } cur.push(p); ink.push(p); };
      cv.addEventListener('pointerdown', e => { if (locked) return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } cur = []; strokesDrawn.push(cur); add(pt(e)); draw(); });
      cv.addEventListener('pointermove', e => { if (!cur || locked) return; e.preventDefault(); add(pt(e)); draw(); });
      const end = () => { cur = null; };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
      let locked = false;
      const msg = app.querySelector('#tmsg');
      app.querySelector('#tclear').addEventListener('click', () => { if (locked) return; ink = []; strokesDrawn = []; msg.textContent = ''; draw(); });
      app.querySelector('#check').addEventListener('click', () => {
        if (locked) return;
        if (ink.length < 15) { msg.textContent = 'Trace the letter first.'; speak('Trace the letter first, then tap check.', true); return; }
        const s = window.VQ.score(guide, ink);
        tries++;
        if (!s.ok && tries < 2) { msg.textContent = 'Almost! Try once more, nice and slow.'; speak('Almost! Try once more, nice and slow.', true); ink = []; strokesDrawn = []; setTimeout(draw, 500); return; }
        locked = true; msg.textContent = '';
        app.querySelector('#tclear').disabled = true;
        check(s.ok ? 1 : 0, null, s.ok ? 'traced' : 'off the line');
      });
      draw();
    }

    function check(v, btn, given) {
      const q = run.qs[run.i];
      const ok = q.kind === 'trace' ? v === 1 : v === q.answer;
      run.log[run.i] = ok;
      if (ok) { run.right++; state.xp += q.usedHint ? 5 : 10; save(); showXP(); }
      if (q.usedHint) run.hints++;
      app.querySelectorAll('.choice, .pad button, #check').forEach(el => (el.disabled = true));
      app.querySelector('#hint').hidden = true;
      let correct;
      if (q.kind === 'choice') {
        app.querySelectorAll('.choice').forEach((b, k) => { if (k === q.answer) b.classList.add('right'); });
        if (!ok && btn) btn.classList.add('wrong');
        correct = q.choices[q.answer];
      } else if (q.kind === 'num') { app.querySelector('#screen').classList.add(ok ? 'right' : 'wrong'); correct = String(q.answer); }
      else correct = q.letter;
      const plain = s => { const d = document.createElement('div'); d.innerHTML = String(s); return d.textContent.replace(/\s+/g, ' ').trim(); };
      run.qlog.push({ n: run.i + 1, prompt: plain(q.prompt).slice(0, 160), answer: /<svg/.test(correct) ? 'picture ' + (q.answer + 1) : plain(correct), given: q.kind === 'choice' ? (/<svg/.test(q.choices[v]) ? 'picture ' + (v + 1) : plain(q.choices[v])) : String(given), correct: ok, hint: !!q.usedHint, seconds: Math.min(600, Math.round((performance.now() - q.t0) / 100) / 10) });
      const cheer = q.kind === 'trace' ? pick(['Beautiful ' + q.letter + '!', 'Great tracing!', 'Super writing!']) : pick(['Yes! Great job!', 'You got it!', 'Super!', 'Awesome!']);
      const fb = app.querySelector('#fb');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      const showAns = q.kind === 'choice' && /<svg/.test(correct) ? 'the green one' : q.kind === 'trace' ? '' : `<b>${correct}</b>`;
      fb.innerHTML = `<p class="verdict">${ok ? `${cheer} <span class="plusxp">+${q.usedHint ? 5 : 10} XP</span>` : q.kind === 'trace' ? 'Good try! Keep practising.' : `Not quite. It is ${showAns}.`}</p>
        <p class="why">${q.explain}</p>
        <button class="btn primary" id="next">${run.i + 1 < QUESTIONS ? 'Next →' : 'See my stars'}</button>`;
      fb.hidden = false;
      speak(ok ? cheer : (q.kind === 'trace' ? 'Good try! ' : 'Not quite. ') + plain(q.explain).replace(/−/g, ' minus '));
      app.querySelector('.dots').innerHTML = dots();
      const nb = app.querySelector('#next');
      nb.addEventListener('click', () => { run.i++; run.i < QUESTIONS ? question() : results(); });
      nb.focus({ preventScroll: true });
      fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function results() {
      const stars = run.right === QUESTIONS && run.hints === 0 ? 3 : run.right >= SILVER ? 2 : run.right >= PASS ? 1 : 0;
      const passed = stars > 0, p = prog(t.id), coinsBefore = earned();
      p.stars[li] = Math.max(p.stars[li] || 0, stars); save();
      const gotCoins = earned() - coinsBefore; showXP();
      record(t, li, run, true, stars);
      const hasNext = li + 1 < t.levels.length;
      const title = !passed ? 'So close!' : !hasNext ? 'Quest complete!' : stars === 3 ? 'Perfect!' : 'Level done!';
      const msg = !passed ? `You got ${run.right} out of ${QUESTIONS}. Get ${PASS} to open level ${li + 2}. The questions change every time. Try again!`
        : stars === 3 ? 'All right, with no hints. Three stars!' : stars === 2 ? `You got ${run.right} out of ${QUESTIONS}. Get them all with no hints for 3 stars.` : `You got ${run.right} out of ${QUESTIONS}. Get ${SILVER} for 2 stars.`;
      go(`<section class="result ${passed ? 'win' : 'lose'}"><p class="eyebrow">Level ${li + 1} · ${L.title}</p><h1>${title}</h1><div class="bigstars">${starRow(stars)}</div><p class="lede">${msg}</p>
          ${gotCoins > 0 ? `<p class="coin-note"><span aria-hidden="true">🪙</span> +${plural(gotCoins, 'coin')}! You have ${balance()}. <button class="link" id="tocoins">Get play time</button></p>` : ''}
          <div class="actions">${passed && hasNext ? `<button class="btn primary" id="nextlvl">Level ${li + 2} →</button>` : ''}<button class="btn ${passed && hasNext ? '' : 'primary'}" id="again">${passed ? 'Play again' : 'Try again'}</button><button class="btn" id="tomap">All levels</button></div></section>`, '.actions .primary');
      speak(`${title} ${msg}` + (gotCoins > 0 ? ` You got ${plural(gotCoins, 'new coin')}!` : ''));
      if (passed) confetti();
      const tc = app.querySelector('#tocoins'); if (tc) tc.addEventListener('click', () => coinsPage());
      const nl = app.querySelector('#nextlvl'); if (nl) nl.addEventListener('click', () => play(t, li + 1));
      app.querySelector('#again').addEventListener('click', () => play(t, li));
      app.querySelector('#tomap').addEventListener('click', () => map(t));
    }
  }

  // question "type": wording with numbers and single letters taken out, so the same kind groups together
  const qType = txt => String(txt || '').replace(/\d+/g, '#').replace(/(^|[\s"'(])[A-Za-z](?=[\s.,?!"')]|$)/g, '$1_').replace(/(#\s*){2,}/g, '# ').slice(0, 90);
  const K_LOCAL = 'vh.sessions.' + CODE;
  // the progress repo is public, so names in story problems are swapped out before saving
  const anon = v => (typeof v === 'string' ? v.replace(/vihaan/gi, 'Kid').replace(/viraj/gi, 'Brother') : v);
  const saveQs = qs => (qs || []).map(q => { const o = { type: qType(anon(q.prompt)) }; Object.keys(q).forEach(k => { o[k] = anon(q[k]); }); return o; });
  function record(t, li, run, completed, stars) {
    const now = new Date(), id = now.toISOString().replace(/[:.]/g, '-') + '-' + Math.random().toString(36).slice(2, 6);
    const s = { v: 1, id, player: CODE, topic: t.id, level: li + 1, levelTitle: anon(t.levels[li].title), startedAt: run.started, endedAt: now.toISOString(), completed, correct: run.right, total: QUESTIONS, stars, hints: run.hints, seconds: Math.round(run.qlog.reduce((a, q) => a + q.seconds, 0)), questions: saveQs(run.qlog) };
    const local = lsGet(K_LOCAL, []); local.push(s); lsSet(K_LOCAL, local.slice(-400));
    return window.VHSync.enqueue(sessionPath(s), s);
  }
  const sessionPath = s => `players/${CODE}/sessions/${s.id.slice(0, 4)}/${s.id.slice(5, 7)}/${s.id}-${s.topic}-L${s.level}${s.completed ? '' : '-quit'}.json`;
  // levels played before saving was added: convert them once and queue them for upload
  (function migrate() {
    const old = lsGet(K_SESS, []); if (!old.length || lsGet('vh.migrated', false)) return;
    const local = lsGet(K_LOCAL, []);
    old.forEach(o => {
      const t = TOPICS.find(x => x.id === o.topic); if (!t) return;
      const id = String(o.at).replace(/[:.]/g, '-') + '-m' + Math.random().toString(36).slice(2, 5);
      const s = { v: 1, id, player: CODE, topic: o.topic, level: o.level, levelTitle: anon(o.title), startedAt: o.at, endedAt: o.at, completed: o.completed, correct: o.correct, total: QUESTIONS, stars: o.stars, hints: o.hints, seconds: o.seconds, questions: saveQs(o.questions) };
      local.push(s); window.VHSync.enqueue(sessionPath(s), s);
    });
    lsSet(K_LOCAL, local.slice(-400)); lsSet('vh.migrated', true);
  })();
  // this device's levels plus any already uploaded (e.g. played on another device)
  async function allSessions() {
    const local = lsGet(K_LOCAL, []); let remote = [], note = '';
    try { remote = await window.VHSync.sessions(CODE); } catch (e) { note = "Couldn't load the online log just now, so this shows this device only."; }
    const seen = new Set(), out = [];
    remote.concat(local).forEach(s => { if (s && !seen.has(s.id)) { seen.add(s.id); out.push(s); } });
    return { sessions: out, note };
  }
  // bring stars and XP over from levels played on other devices
  async function restore() {
    try {
      const remote = await window.VHSync.sessions(CODE); let changed = false, xp = 0;
      remote.forEach(s => {
        (s.questions || []).forEach(q => { if (q.correct) xp += q.hint ? 5 : 10; });
        if (!s.completed || !s.stars) return;
        const pr = prog(s.topic), i = s.level - 1;
        if ((pr.stars[i] || 0) < s.stars) { pr.stars[i] = s.stars; changed = true; }
      });
      if (xp > state.xp) { state.xp = xp; changed = true; }
      if (changed) { save(); showXP(); }
    } catch (e) { /* offline: keep local progress */ }
  }

  /* ---------- parent page (admin): report and settings ---------- */
  function parentPage(tab = 'report') {
    hush();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    const c = window.VHSync.config();
    go(`<nav><button class="link" id="back">← Back to the game</button></nav>
      <section><p class="eyebrow">Parent</p><h1>${KID}'s progress</h1></section>
      <div class="tabs" role="tablist"><button class="tab${tab === 'report' ? ' on' : ''}" data-tab="report">Report</button><button class="tab${tab === 'settings' ? ' on' : ''}" data-tab="settings">Settings</button></div>
      <div id="pp"></div>`);
    app.querySelector('#back').addEventListener('click', () => (loggedIn ? home() : login()));
    app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => parentPage(b.dataset.tab)));
    const el = app.querySelector('#pp');
    if (tab === 'report') {
      el.innerHTML = '<p class="muted">Loading the progress log…</p>';
      allSessions().then(({ sessions, note }) => {
        if (!document.body.contains(el)) return;
        const quests = `<h2 class="rep-h">Quests on this device</h2><div class="tablewrap"><table class="rep"><tr><th>Quest</th><th>Levels</th><th>Stars</th></tr>
          ${TOPICS.map(t => `<tr><td>${t.name}</td><td class="num">${cleared(t)}/10</td><td class="num">${totalStars(t)}/30</td></tr>`).join('')}</table></div>`;
        const pend = window.VHSync.pending();
        window.VHReport.render(el, sessions, TOPICS, AREAS, KID, quests,
          `<p class="muted small">${note ? note + ' ' : ''}${pend ? `${pend} level(s) on this device are still waiting to upload.` : ''}${!c.token ? ' Saving to GitHub is not set up on this device yet (Settings).' : ''}</p>`);
      });
    } else {
      const L = window.VHSync.lastLog();
      const cr = rateOf();
      el.innerHTML = `<section class="panel"><h2>Coins for play time</h2>
          <p class="muted small">${KID} earns coins from stars (each level's best stars count once) and trades them for codes that open play time on BrainPlay. Set the rate here.</p>
          <label class="f" for="c-stars">Stars for 1 coin</label><input id="c-stars" class="txt" type="number" inputmode="numeric" min="1" max="10" step="1" value="${cr.starsPerCoin}">
          <label class="f" for="c-min">Minutes of play for 1 coin</label><select id="c-min" class="txt">${[1, 2, 3, 4, 5, 10, 15, 20].map(m => `<option value="${m}"${m === cr.minutesPerCoin ? ' selected' : ''}>${plural(m, 'minute')}</option>`).join('')}</select>
          <div class="actions left"><button class="btn primary" type="button" id="c-save">Save rate</button></div>
          <p class="pin-msg" id="c-msg" aria-live="polite"></p>
          <p class="muted small">Now: ${allStars()} stars, ${plural(earned(), 'coin')} earned, ${spentCoins()} spent, ${balance()} left.</p></section>
        <section class="panel"><h2>Save progress to GitHub</h2>
          <p class="muted small">Each level is saved as a small text file in <b>${c.repo}</b> under the code <b>${CODE}</b> (no names). Reading the report needs nothing; saving needs an access token, entered here once on ${KID}'s device.</p>
          <label class="f" for="s-repo">Data repo</label><input id="s-repo" class="txt" value="${c.repo}" autocomplete="off">
          <label class="f" for="s-branch">Branch</label><input id="s-branch" class="txt" value="${c.branch}" autocomplete="off">
          <label class="f" for="s-token">Access token</label><input id="s-token" class="txt" type="password" value="${c.token}" autocomplete="off" placeholder="github_pat_…">
          <div class="actions left"><button class="btn primary" type="button" id="s-save">Save and test</button><button class="btn" type="button" id="s-flush">Upload now</button></div>
          <p class="pin-msg" id="s-msg" aria-live="polite"></p>
          <p class="muted small">${c.token ? 'Token saved on this device.' : 'No token saved on this device yet.'} ${window.VHSync.pending()} level(s) waiting to upload.${L ? ` Last upload attempt ${new Date(L.at).toLocaleString()}: ${L.msg}` : ' No uploads tried yet.'}</p></section>
        <section class="panel"><h2>Codes</h2>
          <p class="muted small">${KID} logs in with 3 secret pictures. The parent PIN opens this page and Parent mode.</p>
          <div class="actions left"><button class="btn" type="button" id="p-parent">Change parent PIN</button><button class="btn" type="button" id="p-kid">Reset ${KID}'s pictures</button></div>
          <p class="muted small" id="p-msg" aria-live="polite"></p></section>
        <section class="panel"><h2>Reading out loud</h2>
          <label class="toggle" for="p-voice"><input type="checkbox" id="p-voice" ${voiceOn ? 'checked' : ''}> Read each question out loud</label>
          <label class="f" for="p-vname">Voice</label><select id="p-vname" class="txt"></select>
          <label class="f" for="p-vspeed">Speed</label><select id="p-vspeed" class="txt">${Object.entries(SPEEDS).map(([k, v]) => `<option value="${k}"${lsGet(K_VSPEED, 'normal') === k ? ' selected' : ''}>${v.label}</option>`).join('')}</select>
          <div class="actions left"><button class="btn" type="button" id="p-vtest">🔊 Test</button></div>
          <p class="muted small">These are the voices built into this device, most natural first. Microsoft Edge has the best ones (names ending in "Natural", like Ava or Jenny). On a Mac you can add a better voice: System Settings → Accessibility → Spoken Content → System voice → Manage Voices, then pick an English Premium or Enhanced voice and reload this page. The choice is kept on this device.</p></section>`;
      const msg = el.querySelector('#s-msg');
      el.querySelector('#s-save').addEventListener('click', async () => {
        const cfg = { repo: el.querySelector('#s-repo').value.trim(), branch: el.querySelector('#s-branch').value.trim() || 'main', token: el.querySelector('#s-token').value.trim() };
        msg.className = 'pin-msg'; msg.textContent = 'Checking…';
        const r = await window.VHSync.test(cfg);
        if (r.ok) window.VHSync.setConfig(cfg);
        msg.textContent = r.ok ? r.message + ' Saved.' : r.message;
        msg.className = 'pin-msg ' + (r.ok ? 'good' : 'bad');
        if (r.ok) { const f = await window.VHSync.flush(); if (f.sent) msg.textContent += ` Uploaded ${f.sent} level(s).`; }
      });
      el.querySelector('#s-flush').addEventListener('click', async () => {
        msg.className = 'pin-msg'; msg.textContent = 'Uploading…';
        const f = await window.VHSync.flush();
        msg.textContent = f.error === 'not set up' ? 'Add a token first.' : f.error ? `Couldn't upload (${f.error}). ${f.pending} waiting.` : `Uploaded ${f.sent}. Nothing waiting.`;
      });
      const cm = el.querySelector('#c-msg');
      el.querySelector('#c-save').addEventListener('click', async () => {
        const sp = Math.round(+el.querySelector('#c-stars').value), mp = +el.querySelector('#c-min').value;
        if (!(sp >= 1 && sp <= 10)) { cm.textContent = 'Stars for 1 coin should be 1 to 10.'; cm.className = 'pin-msg bad'; return; }
        const f = await setRate({ starsPerCoin: sp, minutesPerCoin: mp });
        showXP();
        cm.className = 'pin-msg good';
        cm.textContent = `Saved: ${plural(sp, 'star')} = 1 coin = ${plural(mp, 'minute')}.` + (f.error ? ' It will reach his other devices once this one uploads.' : '');
      });
      const m = el.querySelector('#p-msg');
      el.querySelector('#p-parent').addEventListener('click', () => pinDialog('set', () => { m.textContent = 'Parent PIN changed.'; }));
      el.querySelector('#p-kid').addEventListener('click', () => { setPin('kid', null); m.textContent = `${KID} will make new secret pictures next time he logs in.`; });
      el.querySelector('#p-voice').addEventListener('change', e => { voiceOn = e.target.checked; lsSet(K_VOICE, voiceOn); paintVoice(); });
      const vsel = el.querySelector('#p-vname');
      const fillVoices = () => {
        const want = lsGet(K_VNAME, ''), vs = rankedVoices();
        vsel.innerHTML = `<option value="">Automatic${vs[0] ? ` (${vs[0].name.replace(/[<>&"]/g, '')})` : ''}</option>` + vs.map(v => { const n = v.name.replace(/[<>&"]/g, ''); return `<option value="${n}"${n === want ? ' selected' : ''}>${n} · ${v.lang}</option>`; }).join('');
        if (!vs.length) vsel.innerHTML = '<option value="">No voices found on this device</option>';
      };
      fillVoices(); try { speechSynthesis.addEventListener('voiceschanged', fillVoices); } catch (e) { /* no speech */ }
      vsel.addEventListener('change', () => { lsSet(K_VNAME, vsel.value); chooseVoice(); speak(`Hi ${KID}! Let's do some math.`, true); });
      el.querySelector('#p-vspeed').addEventListener('change', e => { lsSet(K_VSPEED, e.target.value); speak(`Hi ${KID}! Let's do some math.`, true); });
      el.querySelector('#p-vtest').addEventListener('click', () => speak(`Hi ${KID}! ${KID} has 5 apples. He gets 3 more. How many now?`, true));
    }
  }

  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
    const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const cols = ['--sun', '--sky', '--grass', '--berry', '--grape'].map(v => css.getPropertyValue(v).trim() || '#fb0');
    const P = Array.from({ length: 120 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 140, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6.28, s: 6 + Math.random() * 7, c: pick(cols) }));
    const t0 = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += .12; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (now - t0 < 1900) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  document.getElementById('home').addEventListener('click', () => (loggedIn ? home() : login()));
  document.getElementById('parent-link').addEventListener('click', () => parentGate(() => parentPage('report')));
  coinEl.addEventListener('click', () => (loggedIn ? coinsPage() : login()));
  lsGet(K_CUR, null) === PLAYER.id && pins().kid ? startAs(location.hash === '#coins' ? 'coins' : undefined) : login();
  if (location.hash === '#parent' || location.hash === '#admin') parentGate(() => parentPage('report'));
  window.addEventListener('online', () => window.VHSync.flush());
})();
</script>
</body>
</html>
