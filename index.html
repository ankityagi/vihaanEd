<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vihaan's Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column on "school paper" blue; chunky tiles, a level ladder, one big question card with a kid keypad. */
:root {
  --bg: #eaf4ff;
  --rule: rgba(43, 125, 224, 0.10);
  --card: #ffffff;
  --ink: #1f2a44;
  --muted: #56647e;
  --line: #c6d8ee;
  --sky: #2b7de0;
  --sun: #ffc93a;
  --sun-ink: #5c4100;
  --grass: #23935a;
  --berry: #dc3d55;
  --grape: #7a52d4;
  --good-bg: #e2f6ea;
  --bad-bg: #fde7ea;
  --soft: #f3f8ff;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Andika', 'Comic Sans MS', system-ui, -apple-system, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a2c; --rule: rgba(160, 200, 255, 0.06); --card: #1a2740; --ink: #eef3fb; --muted: #a8b6cd;
    --line: #2d4063; --sky: #6ea9ff; --sun: #ffd25e; --sun-ink: #3a2a00; --grass: #4fd18a; --berry: #ff7a8c;
    --grape: #b39bff; --good-bg: #133524; --bad-bg: #3d1b22; --soft: #142139; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a2c; --rule: rgba(160, 200, 255, 0.06); --card: #1a2740; --ink: #eef3fb; --muted: #a8b6cd;
  --line: #2d4063; --sky: #6ea9ff; --sun: #ffd25e; --sun-ink: #3a2a00; --grass: #4fd18a; --berry: #ff7a8c;
  --grape: #b39bff; --good-bg: #133524; --bad-bg: #3d1b22; --soft: #142139; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font: 19px/1.45 var(--body); color: var(--ink);
  background-color: var(--bg);
  background-image: linear-gradient(var(--rule) 2px, transparent 2px);
  background-size: 100% 40px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; font: 700 1.45rem var(--display); }
.mark { width: 40px; height: 40px; border-radius: 12px; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; transform: rotate(-6deg); border: 3px solid var(--ink); }
.right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chipbtn { border: 3px solid var(--ink); background: var(--card); border-radius: 999px; padding: 4px 12px; font: 600 .95rem var(--display); cursor: pointer; white-space: nowrap; }
.xp { font: 600 .95rem var(--display); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; background: var(--card); font-variant-numeric: tabular-nums; white-space: nowrap; }
.who { font-size: .85rem; color: var(--muted); white-space: nowrap; }

main.wrap { display: flex; flex-direction: column; gap: 22px; padding-block: 6px 56px; }
h1, h2 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 600; }
.eyebrow { margin: 0 0 4px; font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.lede { margin: 8px 0 0; color: var(--muted); max-width: 58ch; font-size: 1rem; }
.link { background: none; border: 0; padding: 6px 0; cursor: pointer; color: var(--sky); font-weight: 700; }

.btn { border: 3px solid var(--ink); background: var(--card); border-radius: 16px; padding: 12px 20px; font: 600 1.1rem var(--display); cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--sun); color: var(--sun-ink); }
.btn:disabled { opacity: .5; cursor: default; }

/* home */
.area { display: flex; flex-direction: column; gap: 12px; }
.area-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font: 600 .75rem var(--display); text-transform: uppercase; letter-spacing: .08em; background: var(--berry); color: #fff; padding: 3px 10px; border-radius: 999px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.tile { position: relative; text-align: left; display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); padding: 18px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; min-width: 0; transition: transform .12s, box-shadow .12s; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
.tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.tile p { margin: 0; color: var(--muted); font-size: .95rem; }
.badge { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font: 700 1.7rem var(--display); color: #fff; border: 3px solid var(--ink); }
.c-sky { background: var(--sky); } .c-grass { background: var(--grass); } .c-grape { background: var(--grape); } .c-berry { background: var(--berry); } .c-sun { background: var(--sun); color: var(--sun-ink); }
.tag { position: absolute; top: 16px; right: 16px; font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 3px 10px; border-radius: 8px; border: 2px solid var(--ink); background: var(--sun); color: var(--sun-ink); }
.foot { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; color: var(--muted); }
.meter { height: 12px; border-radius: 99px; background: var(--soft); border: 2px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--grass); }
.stars { color: #f2a900; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }

/* players */
.players .tile { align-items: center; text-align: center; padding-block: 28px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--sun-ink); font: 700 2.6rem var(--display); border: 3px solid var(--ink); }

/* level map */
.path { margin-top: 16px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.path span { height: 18px; border-radius: 99px; background: var(--card); border: 2px solid var(--ink); }
.path span.on { background: var(--grass); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.lvl { display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 5px 0 var(--ink); min-width: 0; }
.lvl.locked { cursor: default; border-color: var(--line); box-shadow: none; opacity: .6; }
.lvl.next { outline: 4px dashed var(--sun); outline-offset: 3px; }
.lvl-n { flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font: 700 1.4rem var(--display); background: var(--soft); border: 3px solid currentColor; }
.lvl.done .lvl-n { background: var(--grass); color: #fff; border-color: var(--grass); }
.lvl-b { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lvl-b b { font: 600 1.15rem var(--display); }
.lvl-b small { color: var(--muted); font-size: .88rem; }
.parent-note { margin: 0; font-size: .9rem; color: var(--muted); }

/* play */
.playtop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.where { font: 600 1.05rem var(--display); flex: 1; min-width: 0; text-align: center; }
.dots { display: flex; gap: 6px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); }
.dots i.cur { background: var(--sun); }
.dots i.ok { background: var(--grass); border-color: var(--grass); }
.dots i.no { background: var(--berry); border-color: var(--berry); }
.qcard { background: var(--card); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 7px 0 var(--ink); padding: clamp(16px, 4vw, 30px); display: flex; flex-direction: column; gap: 18px; }
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.qnum { margin: 0; font: 600 .82rem var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.say { border: 3px solid var(--ink); background: var(--soft); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: 600 1rem var(--display); white-space: nowrap; }
.prompt { font-size: clamp(1.25rem, 4vw, 1.6rem); line-height: 1.4; }
.prompt b { color: var(--sky); }
.eq { font: 700 clamp(2.2rem, 9vw, 3.4rem) var(--display); letter-spacing: .02em; display: block; text-align: center; font-variant-numeric: tabular-nums; }
.eq .q { color: var(--berry); }
.fig { margin: 0; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 14px; }
.fig svg { max-width: 100%; height: auto; }
.pics { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 330px; font-size: 2.1rem; line-height: 1; }
.pics span.gone { position: relative; opacity: .45; }
.pics span.gone::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 4px; background: var(--berry); transform: rotate(-35deg); border-radius: 2px; }
.plus { font: 700 2.4rem var(--display); color: var(--muted); }
.grid5 { display: grid; grid-template-columns: repeat(5, auto); gap: 6px 8px; font-size: 2rem; line-height: 1; }
.tenframe { display: grid; grid-template-columns: repeat(5, 46px); gap: 0; border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; }
.tenframe i { width: 46px; height: 46px; border: 1.5px solid var(--line); display: grid; place-items: center; }
.tenframe i.on::before { content: ""; width: 30px; height: 30px; border-radius: 50%; background: var(--berry); }
.bigletter { font: 700 clamp(4.5rem, 20vw, 7rem)/1 var(--body); color: var(--sky); }
.lines { position: relative; width: 210px; height: 150px; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
.lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px dashed var(--muted); }
.lines span { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font: 400 150px/1 var(--body); color: var(--sky); }
.lines span.cap { font-size: 154px; }
.gtable { border-collapse: collapse; font-size: 1.1rem; }
.gtable td { padding: 6px 10px; border-bottom: 2px solid var(--line); }
.gtable td:first-child { font-family: var(--display); font-weight: 600; text-align: right; white-space: nowrap; }
.gtable td:last-child { font-size: 1.7rem; letter-spacing: 4px; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.choice { border: 3px solid var(--ink); border-radius: 16px; background: var(--soft); padding: 14px; cursor: pointer; font: 600 1.35rem var(--display); box-shadow: 0 4px 0 var(--ink); min-height: 72px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.choice.letter { font: 400 3rem/1 var(--body); min-height: 96px; }
.choice.word { font: 400 1.6rem var(--body); }
.choice svg { max-width: 100%; height: auto; }
.choice:hover:not(:disabled) { background: var(--card); }
.choice:disabled { cursor: default; }
.choice.right { background: var(--good-bg); border-color: var(--grass); box-shadow: 0 4px 0 var(--grass); }
.choice.wrong { background: var(--bad-bg); border-color: var(--berry); box-shadow: 0 4px 0 var(--berry); }
.flipx { display: inline-block; transform: scaleX(-1); }
.flipy { display: inline-block; transform: scaleY(-1); }

.entry { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.screen { min-width: 170px; min-height: 76px; border: 3px solid var(--ink); border-radius: 16px; background: var(--soft); display: grid; place-items: center; font: 700 2.6rem var(--display); font-variant-numeric: tabular-nums; padding: 0 16px; }
.screen.empty { color: var(--line); }
.screen.right { border-color: var(--grass); background: var(--good-bg); }
.screen.wrong { border-color: var(--berry); background: var(--bad-bg); }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 64px)); gap: 8px; width: 100%; max-width: 352px; }
.pad button { height: 60px; border: 3px solid var(--ink); border-radius: 14px; background: var(--card); font: 700 1.6rem var(--display); box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
.pad button:active { transform: translateY(3px); box-shadow: none; }
.pad button:disabled { opacity: .5; }
.pad .wide { grid-column: span 2; }
.pad .go { grid-column: span 3; background: var(--sun); color: var(--sun-ink); font-size: 1.3rem; }

.tracebox { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tracebox canvas { width: min(100%, 340px); aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 18px; background: var(--card); touch-action: none; cursor: crosshair; max-width: 100%; }
.tracebtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tracemsg { margin: 0; font: 600 1.1rem var(--display); color: var(--berry); min-height: 1.4em; text-align: center; }

.hintrow { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.hinttext { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--soft); border: 2px dashed var(--line); max-width: 60ch; font-size: 1.05rem; }
.feedback { border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.feedback.good { background: var(--good-bg); border: 3px solid var(--grass); }
.feedback.bad { background: var(--bad-bg); border: 3px solid var(--berry); }
.feedback p { margin: 0; }
.verdict { font: 700 1.4rem var(--display); }
.plusxp { font: 600 .9rem var(--display); color: var(--grass); }
.why { font-size: 1.1rem; }

.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 28px; }
.result .lede { margin-inline: auto; }
.bigstars { font-size: 3.8rem; line-height: 1.1; margin: 6px 0; }
.result.win .bigstars { animation: pop .5s ease-out; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
@keyframes pop { from { transform: scale(.4); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

/* dialogs */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(10, 18, 30, .55); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { width: min(100%, 400px); background: var(--card); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink); padding: 22px; display: flex; flex-direction: column; gap: 12px; max-height: 100%; overflow: auto; }
.sheet .lede { margin: 0; }
.pin { font: 700 1.5rem var(--display); letter-spacing: .3em; text-align: center; color: var(--ink); background: var(--soft); border: 3px solid var(--ink); border-radius: 14px; padding: 10px; width: 100%; }
.err { margin: 0; color: var(--berry); font-weight: 700; font-size: .95rem; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.picks button { font-size: 2.4rem; height: 76px; border: 3px solid var(--ink); border-radius: 16px; background: var(--soft); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.picks button:active { transform: translateY(3px); box-shadow: none; }
.slots { display: flex; justify-content: center; gap: 10px; }
.slots i { width: 60px; height: 60px; border: 3px dashed var(--line); border-radius: 14px; display: grid; place-items: center; font-size: 2rem; font-style: normal; }
.slots i.full { border-style: solid; border-color: var(--ink); }
.sheet .actions { justify-content: flex-end; margin-top: 4px; }

/* parent */
.tabs { display: flex; gap: 8px; border-bottom: 3px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 4px solid transparent; margin-bottom: -3px; padding: 8px 14px; font: 600 1rem var(--display); cursor: pointer; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--sun); }
.panel { background: var(--card); border: 3px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpis div { background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; }
.kpis b { font: 700 1.8rem var(--display); font-variant-numeric: tabular-nums; }
.kpis span { color: var(--muted); font-size: .85rem; }
.tablewrap { overflow-x: auto; }
.rep { border-collapse: collapse; width: 100%; font-size: .92rem; background: var(--card); }
.rep th, .rep td { border-bottom: 2px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.rep th { font: 600 .75rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--soft); }
.rep .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.toggle input { width: 26px; height: 26px; }
.build { text-align: center; font: 500 .8rem var(--display); color: var(--muted); padding-block: 0 24px; }
.build .link { font-size: .8rem; }
.panel label.f { font: 600 .85rem var(--display); margin-top: 4px; }
.txt { font: 600 1rem var(--body); color: var(--ink); background: var(--soft); border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0; }
.pin-msg { margin: 0; font-size: .92rem; min-height: 1.2em; font-weight: 700; }
.pin-msg.good { color: var(--grass); } .pin-msg.bad { color: var(--berry); }
.rep-h { font-size: 1.2rem; margin-top: 10px; }
.chip { display: inline-block; font: 600 .68rem var(--display); text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--muted); }
.chip.slow { border-color: var(--berry); color: var(--berry); }
.chip.fast, .chip.ok { border-color: var(--grass); color: var(--grass); }
.callout { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--bad-bg); border: 2px solid var(--berry); }
.empty { display: flex; flex-direction: column; gap: 6px; }
.actions.left { justify-content: flex-start; }

/* coins and play time */
.coinpill { cursor: pointer; color: var(--ink); }
.coinbar { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 3px solid var(--ink); border-radius: var(--r); padding: 14px 18px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; color: var(--ink); font: inherit; transition: transform .12s, box-shadow .12s; }
.coinbar:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.coinbar > span:nth-child(2) { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.coinbar b { font: 700 1.35rem var(--display); }
.coinbar small { color: var(--muted); }
.coinbig { font-size: 2.2rem; line-height: 1; }
.coinbar .go { flex-shrink: 0; font: 600 .85rem var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: 8px; border: 2px solid var(--ink); background: var(--sun); color: var(--sun-ink); }
.wallet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.wallet-main { min-width: 0; }
.wallet h1 { margin: 0; }
.playopts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.playopts .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px; }
.playopts .btn b { font: 700 1.5rem var(--display); }
.playopts .btn small { font: 600 .9rem var(--display); }
.codebox { border-color: var(--grass); background: var(--good-bg); align-items: center; text-align: center; }
.codebox .lede { margin-inline: auto; }
.playcode { margin: 0; font: 700 clamp(2.4rem, 12vw, 3.8rem) ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; color: var(--ink); }
.playcode.sm { font-size: 1.2rem; letter-spacing: .06em; margin-right: 8px; }
.codelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.codelist li { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.coinstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
.coinstats div { background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.coinstats dt { font: 600 .75rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.coinstats dd { margin: 2px 0 0; font: 700 1.7rem var(--display); font-variant-numeric: tabular-nums; }
.coin-note { margin: 0; font: 700 1.1rem var(--display); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .coinbar .go { display: none; }
  .coinstats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .where { order: 3; flex-basis: 100%; text-align: left; }
  .brand-t { display: none; }
  .who { display: none; }
}
</style>

<body>

<header class="top wrap">
  <button class="brand" id="home" aria-label="Back to all quests"><span class="mark">V</span><span class="brand-t">Vihaan's Quest</span></button>
  <span class="right"><span class="who" id="who"></span><button class="chipbtn" id="voice" aria-pressed="true">🔊 On</button><button class="xp coinpill" id="coins" type="button" hidden aria-label="Coins"></button><span class="xp" id="xp" hidden>0 XP</span></span>
</header>
<main class="wrap" id="app"></main>
<footer class="build"><button class="link" id="parent-link">Parent</button> · Vihaan's Quest · Grade 1</footer>

<script>
/* ======================= Content: pure functions, no DOM at load ======================= */
window.VQ = (function () {
  const KID = 'Vihaan', BRO = 'Viraj';
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uniq = a => [...new Set(a)];
  // multiple choice: correct first, then wrongs; shuffled, duplicates dropped
  function mc(correct, wrongs, n = 4) {
    const w = uniq(wrongs.filter(x => x !== correct)).slice(0, n - 1);
    const all = shuffle([correct, ...w]);
    return { choices: all, answer: all.indexOf(correct) };
  }
  function near(n, lo = 0, hi = 120) {
    const out = new Set();
    let guard = 0;
    while (out.size < 3 && guard++ < 50) { const d = pick([-2, -1, 1, 2, 10, -10, 3]); const v = n + d; if (v !== n && v >= lo && v <= hi) out.add(v); }
    return [...out];
  }

  const FRUIT = [['🍎', 'apples'], ['🚗', 'cars'], ['⭐', 'stars'], ['🐟', 'fish'], ['🍪', 'cookies'], ['🎈', 'balloons'], ['🦆', 'ducks'], ['🍓', 'strawberries'], ['⚽', 'balls'], ['🐞', 'ladybugs']];
  const pics = (e, n, goneFrom = 99) => `<div class="pics" aria-label="${n} pictures">${Array.from({ length: n }, (_, i) => `<span${i >= goneFrom ? ' class="gone"' : ''}>${e}</span>`).join('')}</div>`;
  const grid5 = (e, n) => `<div class="grid5" aria-label="${n} pictures">${Array.from({ length: n }, () => `<span>${e}</span>`).join('')}</div>`;
  const eq = s => `<span class="eq">${s.replace('?', '<span class="q">?</span>')}</span>`;
  const tenframe = n => `<div class="tenframe" aria-label="Ten frame with ${n} dots">${Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;

  /* ---------- drawings ---------- */
  const COLS = ['var(--sky)', 'var(--grass)', 'var(--grape)', 'var(--berry)', 'var(--sun)'];
  const SHAPES = {
    circle: { sides: 0, corners: 0 },
    triangle: { sides: 3, corners: 3, pts: [[50, 8], [94, 88], [6, 88]] },
    square: { sides: 4, corners: 4, pts: [[12, 12], [88, 12], [88, 88], [12, 88]] },
    rectangle: { sides: 4, corners: 4, pts: [[2, 24], [98, 24], [98, 76], [2, 76]] },
    rhombus: { sides: 4, corners: 4, pts: [[50, 4], [86, 50], [50, 96], [14, 50]] },
    trapezoid: { sides: 4, corners: 4, pts: [[28, 22], [72, 22], [96, 80], [4, 80]] },
    pentagon: { sides: 5, corners: 5, pts: [[50, 6], [94, 38], [77, 92], [23, 92], [6, 38]] },
    hexagon: { sides: 6, corners: 6, pts: [[28, 10], [72, 10], [96, 50], [72, 90], [28, 90], [4, 50]] }
  };
  function shape(name, size = 140, col) {
    const s = SHAPES[name], c = col || pick(COLS);
    const body = name === 'circle'
      ? `<circle cx="50" cy="50" r="44" fill="${c}" stroke="var(--ink)" stroke-width="3"/>`
      : `<polygon points="${s.pts.map(p => p.join(',')).join(' ')}" fill="${c}" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>`;
    return `<svg viewBox="-2 -2 104 104" width="${size}" height="${size}" role="img" aria-label="${name}">${body}</svg>`;
  }
  // parts: 'half' | 'quarter' | 'whole' | 'unequal'
  function parts(kind, base) {
    const c = 'var(--sun)', e = 'var(--card)', st = 'stroke="var(--ink)" stroke-width="3"';
    let b = '';
    if (base === 'circle') {
      if (kind === 'whole') b = `<circle cx="50" cy="50" r="44" fill="${c}" ${st}/>`;
      else if (kind === 'half') b = `<circle cx="50" cy="50" r="44" fill="${e}" ${st}/><path d="M50 6 A44 44 0 0 1 50 94 Z" fill="${c}" ${st}/>`;
      else if (kind === 'quarter') b = `<circle cx="50" cy="50" r="44" fill="${e}" ${st}/><path d="M50 50 L50 6 A44 44 0 0 1 94 50 Z" fill="${c}" ${st}/><line x1="6" y1="50" x2="94" y2="50" ${st}/><line x1="50" y1="6" x2="50" y2="94" ${st}/>`;
      else b = `<circle cx="50" cy="50" r="44" fill="${e}" ${st}/><path d="M78 16 A44 44 0 0 1 78 84 Z" fill="${c}" ${st}/>`;
    } else {
      if (kind === 'whole') b = `<rect x="6" y="20" width="88" height="60" fill="${c}" ${st}/>`;
      else if (kind === 'half') b = `<rect x="6" y="20" width="88" height="60" fill="${e}" ${st}/><rect x="6" y="20" width="44" height="60" fill="${c}" ${st}/>`;
      else if (kind === 'quarter') b = `<rect x="6" y="20" width="88" height="60" fill="${e}" ${st}/><rect x="6" y="20" width="22" height="60" fill="${c}" ${st}/><line x1="50" y1="20" x2="50" y2="80" ${st}/><line x1="72" y1="20" x2="72" y2="80" ${st}/>`;
      else b = `<rect x="6" y="20" width="88" height="60" fill="${e}" ${st}/><rect x="6" y="20" width="26" height="60" fill="${c}" ${st}/>`;
    }
    return `<svg viewBox="0 0 100 100" width="150" height="150" role="img" aria-label="Shape cut into parts">${b}</svg>`;
  }
  function clock(h, m, size = 190) {
    const cx = 100, cy = 100, Rr = 88, at = (r, deg) => [cx + r * Math.cos((deg - 90) * Math.PI / 180), cy + r * Math.sin((deg - 90) * Math.PI / 180)];
    let b = `<circle cx="100" cy="100" r="${Rr}" fill="var(--card)" stroke="var(--ink)" stroke-width="5"/>`;
    for (let k = 1; k <= 12; k++) { const [x, y] = at(70, k * 30); b += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="20" fill="var(--ink)">${k}</text>`; }
    const ha = (h % 12) * 30 + m * 0.5, ma = m * 6;
    const [hx, hy] = at(44, ha), [mx, my] = at(68, ma);
    b += `<line x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--sky)" stroke-width="9" stroke-linecap="round"/>`;
    b += `<line x1="100" y1="100" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--ink)"/>`;
    return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="Clock">${b}</svg>`;
  }
  // base-ten blocks: t rods and o cubes
  function blocks(t, o, scale = 1) {
    const u = 13, gap = 8;
    let b = '', x = 4;
    for (let i = 0; i < t; i++) {
      for (let k = 0; k < 10; k++) b += `<rect x="${x}" y="${4 + k * u}" width="${u}" height="${u}" fill="var(--sky)" stroke="var(--ink)" stroke-width="1.5"/>`;
      x += u + gap;
    }
    if (o) x += 6;
    for (let k = 0; k < o; k++) { const col = Math.floor(k / 5), row = k % 5; b += `<rect x="${x + col * (u + 4)}" y="${4 + (9 - row) * u}" width="${u}" height="${u}" fill="var(--sun)" stroke="var(--ink)" stroke-width="1.5"/>`; }
    const w = x + (o ? Math.ceil(o / 5) * (u + 4) : 0) + 4, h = 10 * u + 8;
    return `<svg viewBox="0 0 ${w} ${h}" width="${Math.round(w * 1.4 * scale)}" height="${Math.round(h * 1.4 * scale)}" role="img" aria-label="${t} tens and ${o} ones">${b}</svg>`;
  }
  // bars measured against a cube row. items: [{len, col, label}]
  function lengths(items, cubes) {
    const u = 26, L = 70, w = L + 14 * u + 10, rowH = 46;
    let b = '', y = 8;
    items.forEach(it => {
      b += `<text x="${L - 10}" y="${y + 15}" text-anchor="end" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="16" fill="var(--ink)">${it.label}</text>`;
      b += `<rect x="${L}" y="${y + 3}" width="${it.len * u}" height="24" rx="12" fill="${it.col}" stroke="var(--ink)" stroke-width="2.5"/>`;
      y += rowH;
    });
    if (cubes) for (let k = 0; k < cubes; k++) b += `<rect x="${L + k * u}" y="${y}" width="${u}" height="${u}" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/>`;
    const h = y + (cubes ? u + 8 : 0);
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Lengths">${b}</svg>`;
  }

  const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];

  /* ======================= TOPIC 1: Adding & Taking Away ======================= */
  const addsub = [
    { title: 'Count and Add', skill: 'Add two groups of pictures, up to 10', variants: [
      () => { const [e, n] = pick(FRUIT), a = R(1, 6), b = R(1, 10 - a); return { kind: 'num', prompt: `How many ${n} in all?`, say: `${a} ${n} and ${b} more ${n}. How many in all?`, fig: pics(e, a) + '<span class="plus">+</span>' + pics(e, b), answer: a + b, hint: 'Touch each picture as you count.', explain: `${a} + ${b} = ${a + b}` }; },
      () => { const [e, n] = pick(FRUIT), a = R(2, 6), b = R(1, 10 - a); return { kind: 'num', prompt: `${KID} has <b>${a}</b> ${n}. He gets <b>${b}</b> more. How many now?`, say: `${KID} has ${a} ${n}. He gets ${b} more. How many now?`, fig: pics(e, a) + '<span class="plus">+</span>' + pics(e, b), answer: a + b, hint: `Start at ${a} and count on ${b} more.`, explain: `${a} + ${b} = ${a + b}` }; },
      () => { const [e] = pick(FRUIT), a = R(1, 5), b = R(1, 5); const m = mc(`${a} + ${b}`, [`${a} + ${b + 1}`, `${a + 1} + ${b + 1}`, `${Math.max(1, a - 1)} + ${b}`]); return { kind: 'choice', prompt: 'Which number sentence matches the pictures?', say: 'Which number sentence matches the pictures?', fig: pics(e, a) + '<span class="plus">+</span>' + pics(e, b), ...m, hint: 'Count each group by itself.', explain: `${a} in the first group and ${b} in the second: ${a} + ${b}.` }; }
    ] },
    { title: 'Add to 10', skill: 'Adding numbers up to 10', variants: [
      () => { const a = R(1, 8), b = R(1, 10 - a); return { kind: 'num', prompt: eq(`${a} + ${b} = ?`), say: `${a} plus ${b}`, answer: a + b, hint: `Hold ${Math.max(a, b)} in your head and count on.`, explain: `${a} + ${b} = ${a + b}` }; },
      () => { const a = R(1, 5); return { kind: 'num', prompt: eq(`${a} + ${a} = ?`), say: `${a} plus ${a}. That is a double!`, answer: 2 * a, hint: 'A double is the same number two times.', explain: `${a} + ${a} = ${2 * a}` }; },
      () => { const a = R(2, 7), b = R(1, 9 - a); return { kind: 'num', prompt: `${eq(`${a} + ${b} = ${b} + ?`)}`, say: `${a} plus ${b} is the same as ${b} plus what?`, answer: a, hint: 'You can add in any order and get the same answer.', explain: `${a} + ${b} = ${b} + ${a}. Both are ${a + b}.` }; }
    ] },
    { title: 'Take Away', skill: 'Subtracting within 10', variants: [
      () => { const [e, n] = pick(FRUIT), a = R(4, 10), b = R(1, a - 1); return { kind: 'num', prompt: `There were <b>${a}</b> ${n}. <b>${b}</b> are crossed out. How many are left?`, say: `There were ${a} ${n}. ${b} are crossed out. How many are left?`, fig: pics(e, a, a - b), answer: a - b, hint: 'Count only the ones without a line.', explain: `${a} − ${b} = ${a - b}` }; },
      () => { const a = R(3, 10), b = R(1, a); return { kind: 'num', prompt: eq(`${a} − ${b} = ?`), say: `${a} take away ${b}`, answer: a - b, hint: `Start at ${a} and count back ${b}.`, explain: `${a} − ${b} = ${a - b}` }; },
      () => { const a = R(3, 10), z = Math.random() < .5; return { kind: 'num', prompt: eq(z ? `${a} − 0 = ?` : `${a} − ${a} = ?`), say: z ? `${a} take away zero` : `${a} take away ${a}`, answer: z ? a : 0, hint: z ? 'Taking away zero takes nothing away.' : 'Take them all away. What is left?', explain: z ? `${a} − 0 = ${a}` : `${a} − ${a} = 0` }; }
    ] },
    { title: 'Make 10', skill: 'Number pairs that make 10', variants: [
      () => { const a = R(1, 9); return { kind: 'num', prompt: 'How many more dots to fill the ten frame?', say: 'How many more dots do you need to make 10?', fig: tenframe(a), answer: 10 - a, hint: 'Count the empty boxes.', explain: `${a} + ${10 - a} = 10` }; },
      () => { const a = R(1, 9); return { kind: 'num', prompt: eq(`${a} + ? = 10`), say: `${a} plus what makes 10?`, answer: 10 - a, hint: 'Count up from ' + a + ' to 10 on your fingers.', explain: `${a} + ${10 - a} = 10` }; },
      () => { const a = R(1, 9); const m = mc(`${a} and ${10 - a}`, [`${a} and ${9 - a}`, `${a} and ${11 - a}`, `${Math.min(9, a + 2)} and ${10 - a}`]); return { kind: 'choice', prompt: 'Which two numbers make <b>10</b>?', say: 'Which two numbers make 10?', ...m, hint: 'Add each pair. Which one makes exactly 10?', explain: `${a} + ${10 - a} = 10` }; }
    ] },
    { title: 'Add to 20', skill: 'Adding within 20, using 10 to help', variants: [
      () => { const a = R(6, 9), b = R(11 - a, 9); return { kind: 'num', prompt: eq(`${a} + ${b} = ?`), say: `${a} plus ${b}`, answer: a + b, hint: `Make 10 first: ${a} + ${10 - a} = 10. Then add ${b - (10 - a)} more.`, explain: `${a} + ${10 - a} = 10, and 10 + ${b - (10 - a)} = ${a + b}.` }; },
      () => { const a = R(5, 10), nd = Math.random() < .5; const b = nd ? a + 1 : a; return { kind: 'num', prompt: eq(`${a} + ${b} = ?`), say: `${a} plus ${b}`, answer: a + b, hint: nd ? `Think of the double ${a} + ${a} = ${2 * a}, then add 1.` : 'It is a double. Same number two times.', explain: `${a} + ${b} = ${a + b}` }; },
      () => { const n = R(1, 10), f = Math.random() < .5; return { kind: 'num', prompt: eq(f ? `10 + ${n} = ?` : `${n} + 10 = ?`), say: f ? `10 plus ${n}` : `${n} plus 10`, answer: 10 + n, hint: 'Ten and some more ones makes a teen number.', explain: `10 + ${n} = ${10 + n}` }; }
    ] },
    { title: 'Take Away to 20', skill: 'Subtracting within 20', variants: [
      () => { const c = R(11, 18), b = R(c - 9, 9); return { kind: 'num', prompt: eq(`${c} − ${b} = ?`), say: `${c} take away ${b}`, answer: c - b, hint: `Think: ${b} + what makes ${c}?`, explain: `${b} + ${c - b} = ${c}, so ${c} − ${b} = ${c - b}.` }; },
      () => { const n = R(1, 9); return { kind: 'num', prompt: eq(`${10 + n} − 10 = ?`), say: `${10 + n} take away 10`, answer: n, hint: 'Take away the ten. The ones are left.', explain: `${10 + n} − 10 = ${n}` }; },
      () => { const a = R(5, 9), b = R(4, 9); return { kind: 'num', prompt: `If <b>${a} + ${b} = ${a + b}</b>, then` + eq(`${a + b} − ${b} = ?`), say: `If ${a} plus ${b} is ${a + b}, then what is ${a + b} take away ${b}?`, answer: a, hint: 'Look at the first number sentence. Same numbers!', explain: `${a + b} − ${b} = ${a}` }; }
    ] },
    { title: 'Missing Number', skill: 'Find the missing number', variants: [
      () => { const a = R(2, 12), b = R(1, 20 - a); return { kind: 'num', prompt: eq(`${a} + ? = ${a + b}`), say: `${a} plus what makes ${a + b}?`, answer: b, hint: `Count up from ${a} to ${a + b}.`, explain: `${a} + ${b} = ${a + b}` }; },
      () => { const b = R(2, 9), c = R(1, 11); return { kind: 'num', prompt: eq(`? − ${b} = ${c}`), say: `What number take away ${b} leaves ${c}?`, answer: b + c, hint: `Add them back: ${c} + ${b}.`, explain: `${b + c} − ${b} = ${c}` }; },
      () => { const c = R(8, 20), d = R(1, c - 2); return { kind: 'num', prompt: eq(`${c} − ? = ${d}`), say: `${c} take away what leaves ${d}?`, answer: c - d, hint: `Count up from ${d} to ${c}.`, explain: `${c} − ${c - d} = ${d}` }; },
      () => { const a = R(2, 10), b = R(2, 10); return { kind: 'num', prompt: eq(`? + ${b} = ${a + b}`), say: `What plus ${b} makes ${a + b}?`, answer: a, hint: `Take ${b} away from ${a + b}.`, explain: `${a} + ${b} = ${a + b}` }; }
    ] },
    { title: 'Story Problems', skill: 'Add and take away in stories', variants: [
      () => { const a = R(5, 12), b = R(3, 8); return { kind: 'num', prompt: `${KID} has <b>${a}</b> toy cars. ${BRO} gives him <b>${b}</b> more. How many cars does ${KID} have now?`, say: `${KID} has ${a} toy cars. ${BRO} gives him ${b} more. How many cars does ${KID} have now?`, answer: a + b, hint: 'He gets more, so add.', explain: `${a} + ${b} = ${a + b} cars` }; },
      () => { const a = R(9, 18), b = R(2, 8); return { kind: 'num', prompt: `There are <b>${a}</b> ducks in the pond. <b>${b}</b> fly away. How many ducks are still in the pond?`, say: `There are ${a} ducks in the pond. ${b} fly away. How many ducks are still in the pond?`, answer: a - b, hint: 'Some went away, so take away.', explain: `${a} − ${b} = ${a - b} ducks` }; },
      () => { const a = R(3, 10), b = a + R(2, 8); return { kind: 'num', prompt: `${KID} has <b>${a}</b> stickers. ${BRO} has <b>${b}</b> stickers. How many <b>more</b> stickers does ${BRO} have?`, say: `${KID} has ${a} stickers. ${BRO} has ${b} stickers. How many more stickers does ${BRO} have?`, answer: b - a, hint: `Count up from ${a} to ${b}.`, explain: `${b} − ${a} = ${b - a} more` }; },
      () => { const s = R(6, 15), b = R(2, 5); return { kind: 'num', prompt: `${KID} had some cookies. He ate <b>${b}</b>. Now he has <b>${s - b}</b>. How many cookies did he have at the start?`, say: `${KID} had some cookies. He ate ${b}. Now he has ${s - b}. How many cookies did he have at the start?`, answer: s, hint: 'Put back the ones he ate.', explain: `${s - b} + ${b} = ${s} cookies` }; }
    ] },
    { title: 'Three Numbers', skill: 'Add three numbers and check if sentences are true', variants: [
      () => { const a = R(1, 9), b = 10 - a, c = R(1, 9); const o = shuffle([a, b, c]); return { kind: 'num', prompt: eq(`${o[0]} + ${o[1]} + ${o[2]} = ?`), say: `${o[0]} plus ${o[1]} plus ${o[2]}`, answer: a + b + c, hint: `Look for two numbers that make 10: ${a} and ${b}.`, explain: `${a} + ${b} = 10, and 10 + ${c} = ${10 + c}.` }; },
      () => { const a = R(2, 8), b = R(2, 8), t = Math.random() < .5; const c = R(1, a + b - 1), d = a + b - c + (t ? 0 : pick([-1, 1])); return { kind: 'choice', prompt: `Is this true or false?` + eq(`${a} + ${b} = ${c} + ${d}`), say: `Is this true or false? ${a} plus ${b} equals ${c} plus ${d}.`, choices: ['True', 'False'], answer: t ? 0 : 1, hint: 'Work out both sides. Are they the same?', explain: `${a} + ${b} = ${a + b} and ${c} + ${d} = ${c + d}. ${t ? 'Same, so it is true.' : 'Not the same, so it is false.'}` }; },
      () => { const a = R(3, 9), b = R(3, 9), s = a + b, c = R(1, s - 1); const m = mc(`${c} + ${s - c}`, [`${c} + ${s - c + 1}`, `${c + 2} + ${s - c}`, `${Math.max(1, c - 1)} + ${s - c - 1 > 0 ? s - c - 1 : 1}`]); return { kind: 'choice', prompt: `Which one is the same as <b>${a} + ${b}</b>?`, say: `Which one is the same as ${a} plus ${b}?`, ...m, hint: `${a} + ${b} = ${s}. Which choice also makes ${s}?`, explain: `${a} + ${b} = ${s} and ${c} + ${s - c} = ${s}.` }; }
    ] },
    { title: 'Boss Level', skill: 'A mix of everything, plus bigger adding', variants: [] }
  ];
  addsub[9].variants = [...addsub[4].variants, ...addsub[6].variants, ...addsub[7].variants, ...addsub[8].variants,
    () => { const t = R(1, 8), o = R(0, 5), b = R(1, 9 - o); const n = t * 10 + o; return { kind: 'num', prompt: eq(`${n} + ${b} = ?`), say: `${n} plus ${b}`, answer: n + b, hint: `Keep the ${t} tens. Add the ones: ${o} + ${b}.`, explain: `${n} + ${b} = ${n + b}` }; }];

  /* ======================= TOPIC 2: Numbers & Tens ======================= */
  const tens = [
    { title: 'Count It', skill: 'Count up to 20 things', variants: [
      () => { const [e, n] = pick(FRUIT), k = R(8, 20); return { kind: 'num', prompt: `How many ${n}?`, say: `How many ${n}? Count carefully.`, fig: grid5(e, k), answer: k, hint: 'Each row has 5. Count by 5s, then the rest.', explain: `There are ${k}.` }; },

  /* ---------- letter guides for tracing, in a 300 x 300 box ----------
     Lines: top 40, dashed middle 140, base 240. */
  function strokes(letter) {
    const out = [], arc = (cx, cy, rx, ry, t0, t1, step = 4) => { const p = []; const n = Math.ceil(Math.abs(t1 - t0) / step); for (let i = 0; i <= n; i++) { const t = (t0 + (t1 - t0) * i / n) * Math.PI / 180; p.push([cx + rx * Math.cos(t), cy - ry * Math.sin(t)]); } return p; };
    const line = (a, b) => { const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 4); return Array.from({ length: n + 1 }, (_, i) => [a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]); };
    if (letter === 'd') {

      out.push(line([186, 44], [186, 240]));               // tall line, top to bottom
    } else {
      out.push(line([84, 142], [84, 240]));
      out.push(arc(114, 178, 30, 36, 180, 0).concat(line([144, 178], [144, 240])));
      out.push(arc(174, 178, 30, 36, 180, 0).concat(line([204, 178], [204, 240])));
    }
    return out;
  }
  // Every stroke of the guide must be mostly covered, and most of the ink must sit near the guide.
  function score(guide, ink, tol = 20) {
    if (ink.length < 15) return { cover: 0, prec: 0, ok: false };
    const near = (p, set, t) => set.some(q => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 <= t * t);
    const per = guide.map(st => st.filter(p => near(p, ink, tol)).length / st.length);
    const cover = Math.min(...per), g = guide.flat();
    const prec = ink.filter(p => near(p, g, tol * 1.3)).length / ink.length;
    return { cover, prec, ok: cover >= 0.75 && prec >= 0.8 };
  }

  return { TOPICS, AREAS, KID, strokes, score, util: { R, pick, shuffle } };
})();
