  function login() {
    loggedIn = false; showXP();
    go(`<section><p class="eyebrow">Vihaan's Quest</p><h1>Who's playing?</h1><p class="lede">Tap your name and your secret pictures to start.</p></section>
      <div class="tiles players"><button class="tile" id="pl"><span class="avatar">V</span><h2>${KID}</h2><span class="tag">${pins().kid ? 'Play' : 'Start'}</span></button></div>`, '#pl');
    app.querySelector('#pl').addEventListener('click', () => pictureCode(pins().kid ? 'enter' : 'set', () => startAs()));
  }
  function startAs(topic) { loggedIn = true; lsSet(K_CUR, PLAYER.id); parentMode = false; showXP(); topic === 'coins' ? coinsPage() : topic ? map(topic) : home(); window.VHSync.flush(); restore(); restoreCoins(); }
  function logout() { lsSet(K_CUR, null); parentMode = false; login(); }

  function home() {
    if (!loggedIn) return login();
    const tile = t => {
      const c = cleared(t), n = t.levels.length;
      return `<button class="tile" data-topic="${t.id}">
        <span class="badge ${t.color}" aria-hidden="true">${t.mark}</span>
        <h2>${t.name}</h2><p>${t.blurb}</p>
        <div class="foot"><div class="meter" aria-hidden="true"><i style="width:${(c / n) * 100}%"></i></div><span>${c}/${n} levels · ${starRow(Math.min(3, Math.round(totalStars(t) / n)))}</span></div>
        <span class="tag">${c === 0 ? 'Start' : c === n ? 'Replay' : 'Go on'}</span></button>`;
    };
    const sections = AREAS.map(a => `<section class="area"><h2 class="area-h">${a.name}${a.focus ? ' <span class="pill">Practice most</span>' : ''}</h2><div class="tiles">${TOPICS.filter(t => t.area === a.id && !t.hidden).map(tile).join('')}</div></section>`).join('');
    go(`<section><p class="eyebrow">Pick a quest</p><h1>Hi ${KID}! What shall we do?</h1>
        <p class="lede">Every quest has 10 levels. Get ${PASS} out of ${QUESTIONS} right to open the next level. Tap 🔊 to hear any question.</p>${warmDue() ? `<p class="warmnote"><b>🔥 Warm-up first.</b> ${WARM_N} quick questions on the tricky ones, then pick any quest.</p>` : ''}</section>
        <button class="coinbar" id="coinbar" type="button"><span class="coinbig" aria-hidden="true">🪙</span><span><b>${plural(balance(), 'coin')}</b><small>Stars earn coins. Trade them for game time.</small></span><span class="go">Get play time</span></button>${sections}`);
    app.querySelector('#coinbar').addEventListener('click', () => coinsPage());
    app.querySelectorAll('[data-topic]').forEach(b => b.addEventListener('click', () => { const t = TOPICS.find(x => x.id === b.dataset.topic); warmDue() ? warmUp(() => map(t), `Go to ${t.name} →`) : map(t); }));
    speak(`Hi ${KID}! Pick a quest.`);
  }

  function map(t) {
    const c = cleared(t);
    const nextIdx = t.levels.findIndex((_, i) => unlocked(t, i) && !done(t, i));
    const cards = t.levels.map((L, i) => {
      const open = unlocked(t, i), s = starsFor(t, i);
      return `<button class="lvl${open ? '' : ' locked'}${i === nextIdx ? ' next' : ''}${done(t, i) ? ' done' : ''}" data-i="${i}" ${open ? '' : 'disabled'}>
        <span class="lvl-n">${i + 1}</span>
        <span class="lvl-b"><b>${L.title}</b><small>${open ? L.skill : 'Finish level ' + i + ' to open'}</small></span>
        <span>${!open ? '🔒' : skipped(t, i) && !s ? '<span class="skipchip">Tested out ✓</span>' : starRow(s)}</span></button>`;
    }).join('');
    const hardList = t.levels.map((L, i) => ({ L, i })).filter(x => x.L.hard && done(t, x.i));
    const hardHtml = hardList.length ? `<section class="modep"><h2>⚡ Hard mode</h2><p class="muted small">Every level you pass gets a tougher version: bigger numbers, more typing, trickier choices. Hard levels pay up to 3 coins.</p>
      <div class="hardbtns">${hardList.map(x => `<button class="btn" type="button" data-hard="${x.i}">${x.i + 1}. ${x.L.title} ⚡ <span>${starRow(hardFor(t, x.i))}</span></button>`).join('')}</div></section>` : '';
    const testHtml = c === 0 && t.levels.length > 2 ? `<section class="modep"><h2>Already know this?</h2><p class="muted small">Take a quick test: ${TEST_PER} questions from each level. Every level you get right opens up, so you start where it gets tricky. The test stops at the first miss.</p>
      <div class="actions left"><button class="btn primary" type="button" id="testout">Take the test</button></div></section>` : '';
    go(`<nav><button class="link" id="back">← All quests</button></nav>
      <section><p class="eyebrow">${t.grade}</p><h1>${t.name}</h1><p class="lede">${c} of ${t.levels.length} levels done · ${totalStars(t)} of ${t.levels.length * 3} stars</p>
      <div class="path" aria-hidden="true">${t.levels.map((_, i) => `<span class="${done(t, i) ? 'on' : ''}"></span>`).join('')}</div></section>
      ${testHtml}
      <div class="levels">${cards}</div>
      ${hardHtml}
      <p class="parent-note">${parentMode ? `<b>Parent mode is on.</b> Every level is open until you turn it off or reload. <button class="link" id="pm-off">Turn off</button>` : `<button class="link" id="pm-on">🔒 Parent mode</button> opens every level (needs the parent PIN).`}</p>`, '.lvl.next');
    app.querySelector('#back').addEventListener('click', home);
    const on = app.querySelector('#pm-on'), off = app.querySelector('#pm-off');
    if (on) on.addEventListener('click', () => parentGate(() => { parentMode = true; map(t); }));
    if (off) off.addEventListener('click', () => { parentMode = false; map(t); });
    app.querySelectorAll('.lvl:not(.locked)').forEach(b => b.addEventListener('click', () => play(t, +b.dataset.i)));
    app.querySelectorAll('[data-hard]').forEach(b => b.addEventListener('click', () => play(t, +b.dataset.hard, 'hard')));
    const to = app.querySelector('#testout'); if (to) to.addEventListener('click', () => testOut(t));
  }

  /* ---------- test out: 2 questions per level, in order, stopping at the first miss ---------- */
  const TEST_PER = 4;
  function testOut(t) {
    const qs = [];
    t.levels.slice(0, -1).forEach((L, i) => makeQuestions(L, 'normal', TEST_PER).forEach(q => qs.push(Object.assign(q, { tid: t.id, li: i }))));
    play(t, 0, 'testout', { qs });
  }

  /* ---------- daily warm-up on his weak spots ----------
     Once a day, before his first quest: 6 questions from the 3 levels where his last 20 answers
     are weakest (under 80% right, at least 5 answers). A parent can turn it off in Settings. */
  const WARM_N = 6, K_WARM = 'vh.warmday', K_WARMON = 'vh.warmup';
  const WARM_FALLBACK = [['shapes', 6], ['shapes', 4], ['addsub', 5]]; // Half Past, Measure It, Take Away to 20
  const WARM_T = { id: 'warmup', name: 'Warm-up', levels: [{ title: 'Warm-up', variants: [] }] };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function weakSpots() {
    const seen = new Set(), all = [];
    Object.values(lsGet('vh.cache', {})).concat(lsGet(K_LOCAL, [])).forEach(x => { if (x && x.player === CODE && Array.isArray(x.questions) && !seen.has(x.id)) { seen.add(x.id); all.push(x); } });
    all.sort((a, b) => (a.startedAt < b.startedAt ? -1 : 1));
    const by = {};
    all.forEach(x => { if (x.mode === 'hard') return; x.questions.forEach(q => { const k = `${q.topic || x.topic}|${q.level || x.level}`; (by[k] = by[k] || []).push(!!q.correct); }); });
    const ok = (t, i) => t && !t.hidden && t.levels[i] && t.levels[i].variants.length && unlocked(t, i);
    const spots = Object.entries(by).map(([k, v]) => { const [tid, l] = k.split('|'); const last = v.slice(-20); return { t: TOPICS.find(x => x.id === tid), i: +l - 1, n: last.length, acc: last.filter(Boolean).length / last.length }; })
      .filter(x => x.n >= 5 && x.acc < 0.8 && ok(x.t, x.i)).sort((a, b) => a.acc - b.acc).slice(0, 3);
    if (!spots.length && all.length) WARM_FALLBACK.forEach(([tid, i]) => { const t = TOPICS.find(x => x.id === tid); if (ok(t, i) && starsFor(t, i) < 3) spots.push({ t, i }); });
    return spots;
  }
  const warmDue = () => lsGet(K_WARMON, true) && lsGet(K_WARM, '') !== today() && weakSpots().length > 0;
  function warmUp(after, label) {
    const spots = weakSpots(), per = Math.ceil(WARM_N / spots.length), qs = [];
    spots.forEach(sp => makeQuestions(sp.t.levels[sp.i], 'normal', per).forEach(q => qs.push(Object.assign(q, { tid: sp.t.id, li: sp.i }))));
    play(WARM_T, 0, 'warmup', { qs: window.VQ.util.shuffle(qs).slice(0, WARM_N), after, label });
  }

  /* ---------- playing ---------- */
  // Hard mode types the answer whenever every choice is a plain number
  const typed = q => (q.kind === 'choice' && q.choices.every(c => /^\d+$/.test(String(c))) ? Object.assign({}, q, { kind: 'num', answer: +q.choices[q.answer], choices: undefined }) : q);
  function makeQuestions(L, mode = 'normal', n = QUESTIONS) {
    const src = mode === 'hard' && L.hard ? L.hard : L.variants;
    const key = q => (q.prompt || '') + (q.fig || '') + (q.choices ? q.choices.slice().sort().join('|') : '') + (q.kind === 'trace' ? q.letter + Math.random() : '');
    const out = [], seen = new Set(); let pool = [];
    while (out.length < n) {
      if (!pool.length) pool = window.VQ.util.shuffle(src);
      const v = pool.pop(); let q, tries = 0;
      do { q = v(); tries++; } while (seen.has(key(q)) && tries < 25);
      seen.add(key(q)); out.push(mode === 'hard' ? typed(q) : q);
    }
    return out;
  }

  function play(t, li, mode = 'normal', opts = {}) {
    const L = t.levels[li];
    const run = { qs: opts.qs || makeQuestions(L, mode), i: 0, right: 0, hints: 0, log: [], qlog: [], started: new Date().toISOString() };
    const N = run.qs.length;
    const label = mode === 'warmup' ? '🔥 Warm-up' : mode === 'testout' ? `Test out · ${t.name}` : `Level ${li + 1} · ${L.title}${mode === 'hard' ? ' ⚡ Hard' : ''}`;
    question();
    function dots() { return run.qs.map((_, k) => { const r = run.log[k]; return `<i class="${r === true ? 'ok' : r === false ? 'no' : k === run.i ? 'cur' : ''}"></i>`; }).join(''); }

    function question() {
      const q = run.qs[run.i];
      let ui = '';
      if (q.kind === 'choice') ui = `<div class="choices">${q.choices.map((c, k) => `<button class="choice ${q.cls || ''}" data-k="${k}">${c}</button>`).join('')}</div>`;
      else if (q.kind === 'num') ui = `<div class="entry"><div class="screen empty" id="screen" aria-live="polite">?</div>
          <div class="pad" id="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `<button type="button" data-n="${n}">${n}</button>`).join('')}<button type="button" class="wide" data-n="del" aria-label="Delete">⌫</button><button type="button" class="go" id="check">Check ✓</button></div></div>`;
      else ui = `<div class="tracebox"><canvas id="cv" width="300" height="300" aria-label="Tracing box for the letter ${q.letter}"></canvas><p class="tracemsg" id="tmsg"></p>
          <div class="tracebtns"><button class="btn" type="button" id="tclear">Clear</button><button class="btn primary" type="button" id="check">Check ✓</button></div></div>`;
      go(`<div class="playtop"><button class="link" id="quit">✕ Stop</button><span class="where">${label}</span><span class="dots" aria-label="Question ${run.i + 1} of ${N}">${dots()}</span></div>
        <article class="qcard">
          <div class="qhead"><p class="qnum">Question ${run.i + 1} of ${N}</p><button class="say" id="say" type="button">🔊 Read to me</button></div>
          <div class="prompt">${q.prompt}</div>
          ${q.fig ? `<figure class="fig">${q.fig}</figure>` : ''}
          ${ui}
          <div class="hintrow"><button class="link" id="hint">💡 Need a hint?</button><p class="hinttext" id="hinttext" hidden>${q.hint}</p></div>
          <div class="feedback" id="fb" hidden></div>
        </article>`);
      q.t0 = performance.now();
      speak(q.say);
      app.querySelector('#say').addEventListener('click', () => speak(q.say, true));
      app.querySelector('#quit').addEventListener('click', () => { if (run.qlog.length) record(t, li, run, false, 0, mode); mode === 'warmup' ? home() : map(t); });
      app.querySelector('#hint').addEventListener('click', e => { const ht = app.querySelector('#hinttext'); ht.hidden = false; q.usedHint = true; e.target.hidden = true; speak(q.hint, true); });
      if (q.kind === 'choice') app.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => check(+b.dataset.k, b)));
      else if (q.kind === 'num') numPad(q);
      else tracer(q);
    }

    function numPad(q) {
      let val = '';
      const scr = app.querySelector('#screen');
      const paint = () => { scr.textContent = val || '?'; scr.classList.toggle('empty', !val); };
      const press = n => { if (scr.classList.contains('right') || scr.classList.contains('wrong')) return; if (n === 'del') val = val.slice(0, -1); else if (val.length < 4) val = (val === '0' ? '' : val) + n; paint(); };
      app.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => press(b.dataset.n)));
      const submit = () => { if (!val) { speak('Tap the numbers to type your answer.', true); return; } check(+val, null, val); };
      app.querySelector('#check').addEventListener('click', submit);
      const onKey = e => {
        if (!document.body.contains(scr)) { document.removeEventListener('keydown', onKey); return; }
        if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') { e.preventDefault(); if (!scr.classList.contains('right') && !scr.classList.contains('wrong')) submit(); }
      };
      document.addEventListener('keydown', onKey);
    }

    function tracer(q) {
      const cv = app.querySelector('#cv'), ctx = cv.getContext('2d'), dpr = Math.max(1, window.devicePixelRatio || 1);
      cv.width = 300 * dpr; cv.height = 300 * dpr; ctx.scale(dpr, dpr);
      const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
      const guide = window.VQ.strokes(q.letter); let ink = [], cur = null, tries = 0;
      function draw() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = col('--ink'); ctx.lineWidth = 3; ctx.setLineDash([]);
        [40, 240].forEach(y => { ctx.beginPath(); ctx.moveTo(10, y); ctx.lineTo(290, y); ctx.stroke(); });
        ctx.strokeStyle = col('--muted'); ctx.setLineDash([12, 10]); ctx.beginPath(); ctx.moveTo(10, 140); ctx.lineTo(290, 140); ctx.stroke();
        const alpha = q.guide === 1 ? 0.9 : q.guide === 2 ? 0.4 : 0;
        if (alpha) {
          ctx.globalAlpha = alpha; ctx.strokeStyle = col('--grape'); ctx.lineWidth = 9; ctx.setLineDash([1, 13]);
          guide.forEach(s => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); });
          ctx.globalAlpha = 1;
        }
        ctx.setLineDash([]);
        guide.forEach((s, i) => {
          const [x, y] = s[0];
          ctx.fillStyle = col('--grass'); ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '600 15px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x, y + 1);
        });
        ctx.strokeStyle = col('--sky'); ctx.lineWidth = 12;
        strokesDrawn.forEach(s => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); if (s.length === 1) ctx.lineTo(s[0][0] + .1, s[0][1]); ctx.stroke(); });
      }
      let strokesDrawn = [];
      const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 300 / r.height]; };
      const add = p => { const last = cur[cur.length - 1]; if (last) { const d = Math.hypot(p[0] - last[0], p[1] - last[1]), n = Math.floor(d / 3); for (let k = 1; k <= n; k++) ink.push([last[0] + (p[0] - last[0]) * k / (n + 1), last[1] + (p[1] - last[1]) * k / (n + 1)]); } cur.push(p); ink.push(p); };
      cv.addEventListener('pointerdown', e => { if (locked) return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } cur = []; strokesDrawn.push(cur); add(pt(e)); draw(); });
      cv.addEventListener('pointermove', e => { if (!cur || locked) return; e.preventDefault(); add(pt(e)); draw(); });
      const end = () => { cur = null; };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
      let locked = false;
      const msg = app.querySelector('#tmsg');
      app.querySelector('#tclear').addEventListener('click', () => { if (locked) return; ink = []; strokesDrawn = []; msg.textContent = ''; draw(); });
      app.querySelector('#check').addEventListener('click', () => {
        if (locked) return;
        if (ink.length < 15) { msg.textContent = 'Trace the letter first.'; speak('Trace the letter first, then tap check.', true); return; }
        const s = window.VQ.score(guide, ink);
        tries++;
        if (!s.ok && tries < 2) { msg.textContent = 'Almost! Try once more, nice and slow.'; speak('Almost! Try once more, nice and slow.', true); ink = []; strokesDrawn = []; setTimeout(draw, 500); return; }
        locked = true; msg.textContent = '';
        app.querySelector('#tclear').disabled = true;
        check(s.ok ? 1 : 0, null, s.ok ? 'traced' : 'off the line');
      });
      draw();
    }

    function check(v, btn, given) {
      const q = run.qs[run.i];
      const ok = q.kind === 'trace' ? v === 1 : v === q.answer;
      run.log[run.i] = ok;
      if (mode === 'testout' && !ok) run.stop = true;
      if (ok) { run.right++; state.xp += q.usedHint ? 5 : 10; save(); showXP(); }
      if (q.usedHint) run.hints++;
      app.querySelectorAll('.choice, .pad button, #check').forEach(el => (el.disabled = true));
      app.querySelector('#hint').hidden = true;
      let correct;
      if (q.kind === 'choice') {
        app.querySelectorAll('.choice').forEach((b, k) => { if (k === q.answer) b.classList.add('right'); });
        if (!ok && btn) btn.classList.add('wrong');
        correct = q.choices[q.answer];
      } else if (q.kind === 'num') { app.querySelector('#screen').classList.add(ok ? 'right' : 'wrong'); correct = String(q.answer); }
      else correct = q.letter;
      const plain = s => { const d = document.createElement('div'); d.innerHTML = String(s); return d.textContent.replace(/\s+/g, ' ').trim(); };
      run.qlog.push({ n: run.i + 1, prompt: plain(q.prompt).slice(0, 160), answer: /<svg/.test(correct) ? 'picture ' + (q.answer + 1) : plain(correct), given: q.kind === 'choice' ? (/<svg/.test(q.choices[v]) ? 'picture ' + (v + 1) : plain(q.choices[v])) : String(given), correct: ok, hint: !!q.usedHint, seconds: Math.min(600, Math.round((performance.now() - q.t0) / 100) / 10) });
      { const e = run.qlog[run.qlog.length - 1]; e.fast = ok && e.seconds <= fastLimit(q); }
      if (q.tid) Object.assign(run.qlog[run.qlog.length - 1], { topic: q.tid, level: q.li + 1 });
      const cheer = q.kind === 'trace' ? pick(['Beautiful ' + q.letter + '!', 'Great tracing!', 'Super writing!']) : pick(['Yes! Great job!', 'You got it!', 'Super!', 'Awesome!']);
      const fb = app.querySelector('#fb');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      const showAns = q.kind === 'choice' && /<svg/.test(correct) ? 'the green one' : q.kind === 'trace' ? '' : `<b>${correct}</b>`;
      fb.innerHTML = `<p class="verdict">${ok ? `${cheer} <span class="plusxp">+${q.usedHint ? 5 : 10} XP</span>` : q.kind === 'trace' ? 'Good try! Keep practising.' : `Not quite. It is ${showAns}.`}</p>
        <p class="why">${q.explain}</p>
        <button class="btn primary" id="next">${run.i + 1 < N && !run.stop ? 'Next →' : mode === 'warmup' || mode === 'testout' ? 'See how I did' : 'See my stars'}</button>`;
      fb.hidden = false;
      speak(ok ? cheer : (q.kind === 'trace' ? 'Good try! ' : 'Not quite. ') + plain(q.explain).replace(/−/g, ' minus '));
      app.querySelector('.dots').innerHTML = dots();
      const nb = app.querySelector('#next');
      nb.addEventListener('click', () => { run.i++; run.i < N && !run.stop ? question() : results(); });
      nb.focus({ preventScroll: true });
      fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function results() {
      if (mode === 'warmup') return warmResults();
      if (mode === 'testout') return testResults();
      const quick = run.qlog.filter(x => x.fast).length >= Math.ceil(N * FAST_NEED);
      const stars = run.right === N && run.hints === 0 ? (quick ? 3 : 2) : run.right >= SILVER ? 2 : run.right >= PASS ? 1 : 0;
      const passed = stars > 0, p = prog(t.id), coinsBefore = earned();
      if (mode === 'hard') { p.hard = p.hard || {}; p.hard[li] = Math.max(p.hard[li] || 0, stars); } else p.stars[li] = Math.max(p.stars[li] || 0, stars);
      save();
      const gotCoins = earned() - coinsBefore; showXP();
      record(t, li, run, true, stars, mode);
      const hasNext = mode === 'normal' && li + 1 < t.levels.length;
      const title = !passed ? 'So close!' : mode === 'hard' ? (stars === 3 ? 'Hard mode, perfect!' : 'Hard level done!') : !hasNext ? 'Quest complete!' : stars === 3 ? 'Perfect!' : 'Level done!';
      const msg = !passed ? `You got ${run.right} out of ${N}. Get ${PASS} ${mode === 'hard' ? 'for a star' : `to open level ${li + 2}`}. The questions change every time. Try again!`
        : stars === 3 ? 'All right, with no hints, and quick too. Three stars!' : stars === 2 && run.right === N && run.hints === 0 ? 'All right, with no hints! Answer a bit faster for 3 stars.' : stars === 2 ? `You got ${run.right} out of ${N}. Get them all with no hints, and be quick, for 3 stars.` : `You got ${run.right} out of ${N}. Get ${SILVER} for 2 stars.`;
      go(`<section class="result ${passed ? 'win' : 'lose'}"><p class="eyebrow">${label}</p><h1>${title}</h1><div class="bigstars">${starRow(stars)}</div><p class="lede">${msg}</p>
          ${gotCoins > 0 ? `<p class="coin-note"><span aria-hidden="true">🪙</span> +${plural(gotCoins, 'coin')}! You have ${balance()}. <button class="link" id="tocoins">Get play time</button></p>` : ''}
          <div class="actions">${passed && hasNext ? `<button class="btn primary" id="nextlvl">Level ${li + 2} →</button>` : ''}${passed && mode === 'normal' && t.levels[li].hard ? `<button class="btn" id="hardgo">Try Hard ⚡</button>` : ''}<button class="btn ${passed && hasNext ? '' : 'primary'}" id="again">${passed ? 'Play again' : 'Try again'}</button><button class="btn" id="tomap">All levels</button></div></section>`, '.actions .primary');
      speak(`${title} ${msg}` + (gotCoins > 0 ? ` You got ${plural(gotCoins, 'new coin')}!` : ''));
      if (passed) confetti();
      const tc = app.querySelector('#tocoins'); if (tc) tc.addEventListener('click', () => coinsPage());
      const nl = app.querySelector('#nextlvl'); if (nl) nl.addEventListener('click', () => play(t, li + 1));
      const hg = app.querySelector('#hardgo'); if (hg) hg.addEventListener('click', () => play(t, li, 'hard'));
      app.querySelector('#again').addEventListener('click', () => play(t, li, mode));
      app.querySelector('#tomap').addEventListener('click', () => map(t));
    }

    function warmResults() {
      lsSet(K_WARM, today());
      record(t, li, run, true, 0, mode);
      const msg = `You got ${run.right} out of ${N}. ` + (run.right === N ? 'All right! These used to be tricky.' : 'These are the tricky ones, and every try makes them easier.');
      go(`<section class="result win"><p class="eyebrow">🔥 Warm-up</p><h1>Warmed up!</h1><div class="bigstars" aria-hidden="true">🔥</div><p class="lede">${msg}</p>
          <div class="actions"><button class="btn primary" id="wgo">${opts.label || 'Pick a quest →'}</button></div></section>`);
      speak('Warmed up! ' + msg);
      app.querySelector('#wgo').addEventListener('click', () => (opts.after ? opts.after() : home()));
    }

    function testResults() {
      const per = {};
      run.qs.forEach((q, k) => { if (run.log[k] !== undefined) (per[q.li] = per[q.li] || []).push(run.log[k]); });
      const passedLv = [];
      for (let i = 0; i < t.levels.length - 1; i++) { const r = per[i]; if (r && r.length === TEST_PER && r.every(Boolean)) passedLv.push(i); else break; }
      const p = prog(t.id); p.skip = p.skip || {}; passedLv.forEach(i => { p.skip[i] = true; }); save();
      record(t, li, run, true, 0, mode, { skipped: passedLv.map(i => i + 1) });
      const k = passedLv.length;
      const title = k ? `You can skip ${plural(k, 'level')}!` : 'Good try!';
      const msg = k ? `Level${k > 1 ? `s 1 to ${k} are` : ' 1 is'} open, so you start at level ${k + 1}: ${t.levels[k].title}.` : 'Start at level 1. It gets harder fast, so that is the right place to start.';
      go(`<section class="result ${k ? 'win' : 'lose'}"><p class="eyebrow">${label}</p><h1>${title}</h1><p class="lede">${msg}</p>
          <div class="actions"><button class="btn primary" id="tstart">Start level ${k + 1} →</button><button class="btn" id="tomap">See the levels</button></div></section>`);
      speak(`${title} ${msg}`);
      if (k) confetti();
      app.querySelector('#tstart').addEventListener('click', () => play(t, k));
      app.querySelector('#tomap').addEventListener('click', () => map(t));
    }
  }

  // question "type": wording with numbers and single letters taken out, so the same kind groups together
  const qType = txt => String(txt || '').replace(/\d+/g, '#').replace(/(^|[\s"'(])[A-Za-z](?=[\s.,?!"')]|$)/g, '$1_').replace(/(#\s*){2,}/g, '# ').slice(0, 90);
  const K_LOCAL = 'vh.sessions.' + CODE;
  // the progress repo is public, so names in story problems are swapped out before saving
  // keep the capital-letter pattern, so "Names Start Big" answers stay tellable apart (Vihaan, vihaan, vIhaan)
  const swapName = (m, w) => (m === m.toLowerCase() ? w.toLowerCase() : m === m.toUpperCase() ? w.toUpperCase() : m[0] === m[0].toUpperCase() && m.slice(1) === m.slice(1).toLowerCase() ? w : w[0].toLowerCase() + w.slice(1).toUpperCase());
  const anon = v => (typeof v === 'string' ? v.replace(/vihaan/gi, m => swapName(m, 'Kid')).replace(/viraj/gi, m => swapName(m, 'Brother')) : v);
  const saveQs = qs => (qs || []).map(q => { const o = { type: qType(anon(q.prompt)) }; Object.keys(q).forEach(k => { o[k] = anon(q[k]); }); return o; });
  // mode: normal, hard (tougher version of a level), warmup (mixed weak spots; each question names
  // its own topic and level) or testout (2 per level; skipped lists the levels it opened)
  function record(t, li, run, completed, stars, mode = 'normal', meta = {}) {
    const now = new Date(), id = now.toISOString().replace(/[:.]/g, '-') + '-' + Math.random().toString(36).slice(2, 6);
    const whole = mode === 'warmup' || mode === 'testout';
    const title = mode === 'warmup' ? 'Warm-up' : mode === 'testout' ? 'Test out' : t.levels[li].title + (mode === 'hard' ? ' (Hard)' : '');
    const s = { v: 1, id, player: CODE, topic: t.id, level: whole ? 0 : li + 1, levelTitle: anon(title), startedAt: run.started, endedAt: now.toISOString(), completed, correct: run.right, total: run.qs.length, stars, hints: run.hints, seconds: Math.round(run.qlog.reduce((a, q) => a + q.seconds, 0)), questions: saveQs(run.qlog) };
    if (mode !== 'normal') s.mode = mode;
    if (meta.skipped) s.skipped = meta.skipped;
    const local = lsGet(K_LOCAL, []); local.push(s); lsSet(K_LOCAL, local.slice(-400));
    return window.VHSync.enqueue(sessionPath(s), s);
  }
  const sessionPath = s => `players/${CODE}/sessions/${s.id.slice(0, 4)}/${s.id.slice(5, 7)}/${s.id}-${s.topic}-L${s.level}${s.mode ? '-' + s.mode : ''}${s.completed ? '' : '-quit'}.json`;
  // levels played before saving was added: convert them once and queue them for upload
  (function migrate() {
    const old = lsGet(K_SESS, []); if (!old.length || lsGet('vh.migrated', false)) return;
    const local = lsGet(K_LOCAL, []);
    old.forEach(o => {
      const t = TOPICS.find(x => x.id === o.topic); if (!t) return;
      const id = String(o.at).replace(/[:.]/g, '-') + '-m' + Math.random().toString(36).slice(2, 5);
      const s = { v: 1, id, player: CODE, topic: o.topic, level: o.level, levelTitle: anon(o.title), startedAt: o.at, endedAt: o.at, completed: o.completed, correct: o.correct, total: QUESTIONS, stars: o.stars, hints: o.hints, seconds: o.seconds, questions: saveQs(o.questions) };
      local.push(s); window.VHSync.enqueue(sessionPath(s), s);
    });
    lsSet(K_LOCAL, local.slice(-400)); lsSet('vh.migrated', true);
  })();
  if (computeLegacy(Object.values(lsGet('vh.cache', {})).concat(lsGet(K_LOCAL, [])))) save();
  // this device's levels plus any already uploaded (e.g. played on another device)
  async function allSessions() {
    const local = lsGet(K_LOCAL, []); let remote = [], note = '';
    try { remote = await window.VHSync.sessions(CODE); } catch (e) { note = "Couldn't load the online log just now, so this shows this device only."; }
    const seen = new Set(), out = [];
    remote.concat(local).forEach(s => { if (s && !seen.has(s.id)) { seen.add(s.id); out.push(s); } });
    return { sessions: out, note };
  }
  // bring stars and XP over from levels played on other devices
  async function restore() {
    try {
      const remote = await window.VHSync.sessions(CODE); let changed = computeLegacy(remote), xp = 0;
      remote.forEach(s => {
        (s.questions || []).forEach(q => { if (q.correct) xp += q.hint ? 5 : 10; });
        if (!TOPICS.some(t => t.id === s.topic)) return;
        if (s.mode === 'testout' && Array.isArray(s.skipped)) { const pr = prog(s.topic); pr.skip = pr.skip || {}; s.skipped.forEach(l => { if (!pr.skip[l - 1]) { pr.skip[l - 1] = true; changed = true; } }); return; }
        if (!s.completed || !s.stars) return;
        const pr = prog(s.topic), i = s.level - 1;
        if (s.mode === 'hard') { pr.hard = pr.hard || {}; if ((pr.hard[i] || 0) < s.stars) { pr.hard[i] = s.stars; changed = true; } return; }
        if (s.mode) return;
        if ((pr.stars[i] || 0) < s.stars) { pr.stars[i] = s.stars; changed = true; }
      });
      if (xp > state.xp) { state.xp = xp; changed = true; }
      if (changed) { save(); showXP(); }
    } catch (e) { /* offline: keep local progress */ }
  }

        const f = await window.VHSync.flush();
        msg.textContent = f.error === 'not set up' ? 'Add a token first.' : f.error ? `Couldn't upload (${f.error}). ${f.pending} waiting.` : `Uploaded ${f.sent}. Nothing waiting.`;
      });

      el.querySelector('#c-save').addEventListener('click', async () => {
        const n = +el.querySelector('#c-five').value;
        if (!COIN_STEPS.includes(n)) { cm.textContent = 'Pick how many coins buy 5 minutes.'; cm.className = 'pin-msg bad'; return; }

        cm.className = 'pin-msg good';
        cm.textContent = `Saved: ${plural(n, 'coin')} = 5 minutes.` + (f.error ? ' It will reach his other devices once this one uploads.' : '');
      });

      el.querySelector('#p-parent').addEventListener('click', () => pinDialog('set', () => { m.textContent = 'Parent PIN changed.'; }));

  }

  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
    const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const cols = ['--sun', '--sky', '--grass', '--berry', '--grape'].map(v => css.getPropertyValue(v).trim() || '#fb0');
    const P = Array.from({ length: 120 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 140, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6.28, s: 6 + Math.random() * 7, c: pick(cols) }));
    const t0 = performance.now();
